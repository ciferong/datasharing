<title>Lull — Baby Tracker (Prototype)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<style>
  :root {
    --bg: #eaeef7; --bg-glow: #dfe6f5; --surface: #ffffff; --surface-2: #f3f6fc;
    --border: #e2e7f1; --border-strong: #d3dae8; --text: #1a2138; --text-dim: #59617c;
    --text-faint: #8a92ad; --accent: #e2a244; --accent-ink: #2a1c00; --feed: #e8663b;
    --sleep: #6b5cd6; --diaper: #12a184; --good: #1fa06f;
    --shadow: 0 10px 30px rgba(30,40,70,.10); --shadow-sheet: 0 -12px 40px rgba(20,28,55,.18);
    --ring: rgba(226,162,68,.55);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1526; --bg-glow: #182142; --surface: #172038; --surface-2: #1e2842;
      --border: #29344f; --border-strong: #3442615c; --text: #eef1f8; --text-dim: #9aa5c0;
      --text-faint: #6b7796; --accent: #f0c07a; --accent-ink: #241700; --feed: #ff9e7d;
      --sleep: #9c8cff; --diaper: #4fc9ac; --good: #58d69e;
      --shadow: 0 12px 34px rgba(0,0,0,.38); --shadow-sheet: 0 -14px 44px rgba(0,0,0,.5);
      --ring: rgba(240,192,122,.5);
    }
  }
  :root[data-theme="light"] {
    --bg: #eaeef7; --bg-glow: #dfe6f5; --surface: #ffffff; --surface-2: #f3f6fc;
    --border: #e2e7f1; --border-strong: #d3dae8; --text: #1a2138; --text-dim: #59617c;
    --text-faint: #8a92ad; --accent: #e2a244; --accent-ink: #2a1c00; --feed: #e8663b;
    --sleep: #6b5cd6; --diaper: #12a184; --good: #1fa06f;
    --shadow: 0 10px 30px rgba(30,40,70,.10); --shadow-sheet: 0 -12px 40px rgba(20,28,55,.18);
    --ring: rgba(226,162,68,.55);
  }
  :root[data-theme="dark"] {
    --bg: #0f1526; --bg-glow: #182142; --surface: #172038; --surface-2: #1e2842;
    --border: #29344f; --border-strong: #3442615c; --text: #eef1f8; --text-dim: #9aa5c0;
    --text-faint: #6b7796; --accent: #f0c07a; --accent-ink: #241700; --feed: #ff9e7d;
    --sleep: #9c8cff; --diaper: #4fc9ac; --good: #58d69e;
    --shadow: 0 12px 34px rgba(0,0,0,.38); --shadow-sheet: 0 -14px 44px rgba(0,0,0,.5);
    --ring: rgba(240,192,122,.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(120% 60% at 50% -8%, var(--bg-glow), transparent 60%), var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.45; min-height: 100dvh;
  }
  .tnum { font-variant-numeric: tabular-nums; }

  .app { max-width: 480px; margin: 0 auto; min-height: 100dvh;
    padding: 20px 18px calc(190px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 16px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .greet { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .greet .hi { font-size: 13px; color: var(--text-dim); letter-spacing: .02em; }
  .baby-btn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font-size: 23px; font-weight: 700; letter-spacing: -.02em; color: var(--text); border-radius: 10px; }
  .baby-btn .age { font-size: 12px; font-weight: 600; color: var(--text-faint); }
  .baby-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
  .hbtns { display: flex; gap: 8px; }
  .icobtn { all: unset; cursor: pointer; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); box-shadow: var(--shadow); }
  .icobtn svg { width: 20px; height: 20px; }
  .icobtn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  /* logging-as chip */
  .asbar { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 8px 10px 8px 12px; box-shadow: var(--shadow); }
  .asbar .fam { display: flex; align-items: center; }
  .asbar .fam .av { margin-left: -7px; box-shadow: 0 0 0 2px var(--surface); }
  .asbar .fam .av:first-child { margin-left: 0; }
  .asbar .aslabel { font-size: 12px; color: var(--text-faint); font-weight: 600; }
  .asbtn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font-size: 13.5px; font-weight: 700; color: var(--text); }
  .asbtn svg { width: 15px; height: 15px; color: var(--text-faint); }
  .asbtn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
  .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 800; color: #fff; flex: none; }

  .simplebanner { display: none; align-items: center; gap: 10px; background: color-mix(in srgb, var(--diaper) 16%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--diaper) 40%, var(--border)); border-radius: 14px; padding: 10px 12px; }
  .simplebanner.on { display: flex; }
  .simplebanner .txt { flex: 1; font-size: 13px; font-weight: 600; }
  .simplebanner button { all: unset; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--diaper); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px 12px 13px; box-shadow: var(--shadow); overflow: hidden; }
  .tile .cap { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
    letter-spacing: .03em; text-transform: uppercase; color: var(--text-faint); }
  .tile .cap .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tile .val { margin-top: 8px; font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
  .tile .val small { font-size: 12px; font-weight: 600; color: var(--text-dim); }
  .tile .sub { font-size: 11.5px; color: var(--text-faint); margin-top: 1px; }

  .nudge { display: flex; align-items: center; gap: 13px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 12%, var(--surface)), var(--surface));
    border: 1px solid color-mix(in srgb, var(--accent) 34%, var(--border)); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); }
  .nudge .glyph { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
  .nudge .glyph svg { width: 22px; height: 22px; }
  .nudge .lead { font-size: 12px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--text-faint); }
  .nudge .msg { font-size: 15px; font-weight: 600; text-wrap: balance; }
  .nudge .msg b { color: var(--accent); font-weight: 700; }
  .nudge .why { font-size: 12px; color: var(--text-faint); margin-top: 2px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
  .card > .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .card > .head h2 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
  .card > .head .meta { font-size: 12px; color: var(--text-faint); }

  .timeline { position: relative; height: 58px; margin-top: 4px; }
  .tl-track { position: absolute; left: 0; right: 0; top: 14px; height: 30px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 9px; }
  .tl-grid { position: absolute; top: 14px; height: 30px; width: 1px; background: var(--border); }
  .tl-hour { position: absolute; top: 47px; transform: translateX(-50%); font-size: 10px; color: var(--text-faint); }
  .tl-now { position: absolute; top: 8px; height: 42px; width: 2px; background: var(--accent); border-radius: 2px; z-index: 4; box-shadow: 0 0 8px var(--accent); }
  .tl-bar { position: absolute; top: 17px; height: 24px; border-radius: 6px; z-index: 2; opacity: .92; }
  .tl-dot { position: absolute; top: 20px; width: 11px; height: 11px; border-radius: 50%; transform: translateX(-50%); z-index: 3; border: 2px solid var(--surface); }
  .legend { display: flex; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-dim); }
  .legend i { width: 9px; height: 9px; border-radius: 50%; }

  .list { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; gap: 11px; padding: 11px 2px; border-top: 1px solid var(--border); }
  .row:first-child { border-top: 0; }
  .rowmain { all: unset; cursor: pointer; display: flex; align-items: center; gap: 11px; flex: 1; min-width: 0; border-radius: 10px; }
  .rowmain:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .row .ic { width: 38px; height: 38px; border-radius: 11px; flex: none; display: grid; place-items: center; position: relative; }
  .row .ic svg { width: 20px; height: 20px; }
  .row .ic .who { position: absolute; right: -4px; bottom: -4px; width: 17px; height: 17px; border-radius: 50%;
    display: grid; place-items: center; font-size: 9px; font-weight: 800; color: #fff; box-shadow: 0 0 0 2px var(--surface); }
  .row .body { flex: 1; min-width: 0; }
  .row .t1 { font-size: 14.5px; font-weight: 600; }
  .row .t2 { font-size: 12.5px; color: var(--text-faint); }
  .row .when { font-size: 12.5px; color: var(--text-dim); text-align: right; white-space: nowrap; }
  .row .del { all: unset; cursor: pointer; color: var(--text-faint); border-radius: 8px; padding: 8px; display: grid; place-items: center; opacity: .6; }
  .row .del:hover { opacity: 1; color: var(--feed); }
  .row .del:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
  .empty { text-align: center; color: var(--text-faint); font-size: 13.5px; padding: 20px 0 6px; }
  .empty .big { font-size: 26px; margin-bottom: 6px; }

  .timerbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 40;
    width: min(444px, calc(100vw - 36px)); display: none; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 16px; padding: 10px 10px 10px 14px; box-shadow: var(--shadow); }
  .timerbar.on { display: flex; }
  .timerbar .pulse { width: 12px; height: 12px; border-radius: 50%; flex: none; animation: pulse 1.8s ease-in-out infinite; }
  .timerbar .lab { flex: 1; min-width: 0; }
  .timerbar .lab .k { font-size: 12px; color: var(--text-faint); font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
  .timerbar .lab .v { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .timerbar .side { all: unset; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--feed);
    border: 1px solid color-mix(in srgb, var(--feed) 40%, var(--border)); border-radius: 9px; padding: 8px 10px; }
  .timerbar .stop { all: unset; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--accent-ink);
    background: var(--accent); padding: 10px 15px; border-radius: 11px; }
  .timerbar .side:focus-visible, .timerbar .stop:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .4; transform: scale(.82);} }

  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 12px 18px calc(14px + env(safe-area-inset-bottom)); display: flex; justify-content: center;
    background: linear-gradient(180deg, transparent, var(--bg) 32%); }
  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; width: min(480px, 100%); }
  .act { all: unset; cursor: pointer; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 13px 6px; border-radius: 18px; font-weight: 700; font-size: 13px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
    transition: transform .08s ease, background .15s ease; color: var(--text); }
  .act:active { transform: translateY(2px) scale(.985); }
  .act:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .act svg { width: 26px; height: 26px; }
  .act.feed { color: var(--feed); } .act.sleep { color: var(--sleep); } .act.diaper { color: var(--diaper); }
  .act .lbl { color: var(--text); }
  .act.more { padding: 13px 16px; color: var(--text-dim); }
  .act.armed { background: color-mix(in srgb, var(--sleep) 20%, var(--surface)); border-color: var(--sleep); }

  /* simple mode */
  .app.simple #stats, .app.simple #nudge, .app.simple #tlCard { display: none; }
  .app.simple .act { padding: 22px 6px; font-size: 16px; border-radius: 22px; }
  .app.simple .act svg { width: 34px; height: 34px; }
  .app.simple .act .lbl { font-size: 16px; }
  .app.simple .row { padding: 15px 2px; }
  .app.simple .row .t1 { font-size: 16.5px; }
  .app.simple .card > .head h2 { font-size: 16px; }

  .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(8,12,24,.5); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%); z-index: 51; width: min(480px, 100%);
    background: var(--surface); border: 1px solid var(--border); border-radius: 24px 24px 0 0; box-shadow: var(--shadow-sheet);
    padding: 10px 18px calc(22px + env(safe-area-inset-bottom)); transition: transform .26s cubic-bezier(.22,.8,.28,1);
    max-height: 88dvh; overflow-y: auto; }
  .sheet.on { transform: translate(-50%, 0); }
  .grip { width: 40px; height: 4px; border-radius: 3px; background: var(--border-strong); margin: 4px auto 14px; }
  .sheet h3 { margin: 0 0 3px; font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
  .sheet .sub { margin: 0 0 16px; font-size: 13px; color: var(--text-faint); }
  .sheet h4 { margin: 18px 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-faint); }

  .tabs { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 13px; margin-bottom: 16px; }
  .tabs button { all: unset; cursor: pointer; flex: 1; text-align: center; padding: 9px 4px; border-radius: 10px;
    font-size: 13.5px; font-weight: 600; color: var(--text-dim); }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .tabs button:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .seg.three { grid-template-columns: repeat(3, 1fr); }
  .chip { all: unset; cursor: pointer; box-sizing: border-box; text-align: center; padding: 16px 8px; border-radius: 15px;
    font-size: 15px; font-weight: 700; background: var(--surface-2); border: 1.5px solid var(--border); color: var(--text);
    display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .chip svg { width: 24px; height: 24px; }
  .chip:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .chip[aria-pressed="true"] { border-color: currentColor; background: color-mix(in srgb, currentColor 14%, var(--surface)); }
  .chip.f { color: var(--feed); } .chip.s { color: var(--sleep); } .chip.d { color: var(--diaper); }
  .chip .cl { color: var(--text); font-size: 15px; }
  .chip small { color: var(--text-faint); font-size: 11.5px; font-weight: 600; }

  .whenrow { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
  .whenrow button { all: unset; cursor: pointer; padding: 9px 13px; border-radius: 11px; font-size: 13px; font-weight: 700;
    background: var(--surface-2); border: 1.5px solid var(--border); color: var(--text-dim); }
  .whenrow button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .whenrow input[type="time"] { font-family: inherit; font-size: 13px; padding: 8px 10px; border-radius: 11px;
    background: var(--surface-2); border: 1.5px solid var(--border); color: var(--text); }

  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .presets button { all: unset; cursor: pointer; padding: 11px 15px; border-radius: 12px; font-size: 15px; font-weight: 700;
    background: var(--surface-2); border: 1.5px solid var(--border); color: var(--text); }
  .presets button[aria-pressed="true"] { border-color: var(--feed); background: color-mix(in srgb, var(--feed) 12%, var(--surface)); }
  .presets button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 15px; padding: 12px 14px; margin-bottom: 14px; }
  .stepper .amt { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .stepper .amt small { font-size: 15px; color: var(--text-dim); font-weight: 600; }
  .stepper .pm { display: flex; gap: 8px; }
  .rnd { all: unset; cursor: pointer; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    font-size: 24px; font-weight: 700; background: var(--surface); border: 1.5px solid var(--border-strong); color: var(--text); }
  .rnd:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .rnd:active { transform: scale(.94); }

  .field { width: 100%; box-sizing: border-box; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 13px; padding: 13px 14px; font-size: 15px; margin-bottom: 14px; font-family: inherit; }
  .field:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
  label.lbl { font-size: 12px; color: var(--text-faint); font-weight: 600; display: block; margin: -6px 0 6px; }

  .cta { all: unset; cursor: pointer; box-sizing: border-box; width: 100%; text-align: center; padding: 16px; border-radius: 16px;
    font-size: 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
  .cta:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .cta:active { transform: translateY(1px); }
  .cta.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .cta.danger { background: color-mix(in srgb, var(--feed) 14%, var(--surface)); color: var(--feed); border: 1px solid color-mix(in srgb, var(--feed) 30%, var(--border)); }
  .cta.big { display: flex; align-items: center; justify-content: center; gap: 9px; }
  .cta.big svg { width: 22px; height: 22px; }
  .ctarow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .unitrow { display: flex; gap: 8px; margin-bottom: 14px; }
  .unitrow button { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 700;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim); }
  .unitrow button[aria-pressed="true"] { color: var(--text); border-color: var(--border-strong); }

  /* member list / settings toggles */
  .member { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .member:first-of-type { border-top: 0; }
  .member .info { flex: 1; min-width: 0; }
  .member .nm { font-size: 15px; font-weight: 700; }
  .member .rl { font-size: 12px; color: var(--text-faint); }
  .member .badges { display: flex; gap: 6px; margin-top: 3px; }
  .member .tag { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 20px;
    background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }
  .logas { all: unset; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--accent);
    padding: 8px 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); }
  .logas[data-cur="1"] { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--border)); cursor: default; }
  .logas:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  .invite { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px dashed var(--border-strong);
    border-radius: 13px; padding: 12px 14px; margin-bottom: 8px; }
  .invite code { flex: 1; font-size: 14px; font-weight: 700; letter-spacing: .04em; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .invite button { all: unset; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--accent); padding: 6px 10px; border-radius: 9px; }
  .freeline { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--good); font-weight: 600; margin: 4px 0 4px; }

  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-top: 1px solid var(--border); }
  .toggle:first-of-type { border-top: 0; }
  .toggle .tl { font-size: 14.5px; font-weight: 600; }
  .toggle .td { font-size: 12px; color: var(--text-faint); }
  .sw { all: unset; cursor: pointer; width: 46px; height: 28px; border-radius: 20px; background: var(--border-strong); position: relative; flex: none; transition: background .15s ease; }

<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var K = { ev: "lull.events.v4", baby: "lull.baby.v4", timer: "lull.timer.v4", pref: "lull.pref.v4", care: "lull.care.v4", cur: "lull.cur.v4" };

  /* ---------- i18n (English + demo Tagalog for the helper) ---------- */
  var I18N = {
    en: {
      g_morning:"Good morning", g_afternoon:"Good afternoon", g_evening:"Good evening", g_night:"Late night",
      feed:"Feed", sleep:"Sleep", diaper:"Diaper", more:"More", wake:"Wake",
      nursing:"Nursing", bottle:"Bottle", solids:"Solids", left:"Left", right:"Right", breast:"breast",
      start_nursing:"Start nursing timer", log_bottle:"Log bottle", log_solids:"Log solids",
      wet:"Wet", dirty:"Dirty", mixed:"Mixed",
      next_up:"Next up", todays_rhythm:"Today's rhythm", recent:"Recent activity",
      last_feed:"Last feed", sleep_today:"Sleep today", diapers:"Diapers", fed_today:"Fed today",
      right_now:"Right now", last_diaper:"Last diaper", asleep:"Asleep", awake:"Awake",
      saved:"saved", logged:"logged", when:"When", now:"Now", today:"today",
      logging_as:"Logging as", switch_back:"Switch back", simple_mode:"Simple mode", nothing:"Nothing logged yet",
      tapbelow:"Tap a button below to start", feed_a:"Log a feed", diaper_a:"Log a diaper", onetap:"One tap."
    },
    tl: {
      g_morning:"Magandang umaga", g_afternoon:"Magandang hapon", g_evening:"Magandang gabi", g_night:"Gabing-gabi na",
      feed:"Pakain", sleep:"Tulog", diaper:"Lampin", more:"Iba pa", wake:"Gising",
      nursing:"Pasuso", bottle:"Bote", solids:"Solidong pagkain", left:"Kaliwa", right:"Kanan", breast:"suso",
      start_nursing:"Simulan ang pasuso", log_bottle:"I-record ang bote", log_solids:"I-record ang pagkain",
      wet:"Basa", dirty:"Dumi", mixed:"Basa at dumi",
      next_up:"Susunod", todays_rhythm:"Takbo ngayong araw", recent:"Mga huling ginawa",
      last_feed:"Huling pakain", sleep_today:"Tulog ngayon", diapers:"Lampin", fed_today:"Nainom ngayon",
      right_now:"Ngayon mismo", last_diaper:"Huling lampin", asleep:"Tulog", awake:"Gising",
      saved:"na-save", logged:"na-record", when:"Kailan", now:"Ngayon", today:"ngayon",
      logging_as:"Nagre-record bilang", switch_back:"Bumalik", simple_mode:"Simpleng mode", nothing:"Wala pang record",
      tapbelow:"Pindutin ang buton sa ibaba", feed_a:"Mag-record ng pakain", diaper_a:"Mag-record ng lampin", onetap:"Isang pindot lang."
    }
  };

  var DEFAULT_CARE = [
    { id:"you",   name:"You",   badge:"Y", color:"#e2a244", role:"Owner",   simple:false, lang:"en" },
    { id:"grace", name:"Grace", badge:"G", color:"#12a184", role:"Helper",  simple:true,  lang:"tl" },
    { id:"sam",   name:"Sam",   badge:"S", color:"#6b5cd6", role:"Partner", simple:false, lang:"en" }
  ];

  var db = {
    events: load(K.ev, null), baby: load(K.baby, null), timer: load(K.timer, null),
    pref: load(K.pref, { unit:"ml", side:"L", tiles:["lastFeed","sleep","diapers"] }),
    care: load(K.care, null), cur: load(K.cur, "you")
  };
  var lastDeleted = null, toastTimer = null;

  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function saveK(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function persist() { saveK(K.ev, db.events); saveK(K.baby, db.baby); saveK(K.timer, db.timer); saveK(K.pref, db.pref); saveK(K.care, db.care); saveK(K.cur, db.cur); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  if (!db.care) db.care = DEFAULT_CARE.map(function (c) { return Object.assign({}, c); });
  if (!db.pref.tiles) db.pref.tiles = ["lastFeed","sleep","diapers"];

  if (db.events === null) {
    db.baby = { name:"Baby", dob: Date.now() - 86400000 * 84 };
    db.events = seed(); persist();
  }
  if (!db.baby) db.baby = { name:"Baby", dob:null };

  function seed() {
    var now = Date.now(), H = 3600000, M = 60000, e = [];
    function a(o) { e.push(o); }
    a({ id:uid(), type:"feed", sub:"nursing", side:"L", by:"sam",   start: now - 6.7*H, end: now - 6.7*H + 16*M });
    a({ id:uid(), type:"diaper", sub:"wet",     by:"sam",   start: now - 6.4*H });
    a({ id:uid(), type:"sleep",                 by:"you",   start: now - 6.1*H, end: now - 4.2*H });
    a({ id:uid(), type:"feed", sub:"bottle", amount:120, unit:"ml", by:"grace", start: now - 4.0*H });
    a({ id:uid(), type:"diaper", sub:"dirty",   by:"grace", start: now - 3.6*H });
    a({ id:uid(), type:"sleep",                 by:"grace", start: now - 3.1*H, end: now - 1.7*H });
    a({ id:uid(), type:"feed", sub:"nursing", side:"R", by:"you", start: now - 1.5*H, end: now - 1.5*H + 19*M });
    a({ id:uid(), type:"diaper", sub:"mixed",   by:"grace", start: now - 1.1*H });
    return e.sort(function (x, y) { return x.start - y.start; });
  }

  /* ---------- helpers ---------- */
  function cur() { return db.care.filter(function (c) { return c.id === db.cur; })[0] || db.care[0]; }
  function careById(id) { return db.care.filter(function (c) { return c.id === id; })[0] || db.care[0]; }
  function lang() { return cur().lang || "en"; }
  function simpleOn() { return !!cur().simple; }
  function t(key) { var L = I18N[lang()] || I18N.en; return L[key] != null ? L[key] : (I18N.en[key] != null ? I18N.en[key] : key); }

  function fmtClock(ts) { return new Date(ts).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }); }
  function ago(ts) {
    var s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (s < 60) return t("now").toLowerCase() === "ngayon" ? "ngayon lang" : "just now";
    var m = Math.floor(s/60); if (m < 60) return m + "m ago";
    var h = Math.floor(m/60), r = m%60; return r ? h + "h " + r + "m ago" : h + "h ago";
  }
  function dur(ms) { var s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
    return h>0 ? h+":"+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0") : m+":"+String(ss).padStart(2,"0"); }
  function durShort(ms) { var m=Math.round(ms/60000); if (m<60) return m+"m"; var h=Math.floor(m/60), r=m%60; return r ? h+"h "+r+"m" : h+"h"; }
  function startOfDay() { var d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
  function todays() { var s = startOfDay(); return db.events.filter(function (x) { return x.start >= s; }); }
  function ageText() { if (!db.baby.dob) return ""; var d=Math.floor((Date.now()-db.baby.dob)/86400000);
    return d<14 ? d+"d" : d<90 ? Math.floor(d/7)+"w" : Math.floor(d/30.4)+"mo"; }

  var ICONS = {
    feed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8M9 2l.6 3M15 2l-.6 3"/><path d="M7.5 8.5c0-1.7 1.2-3 2.7-3.4h3.6c1.5.4 2.7 1.7 2.7 3.4V19a3 3 0 0 1-3 3H10.5a3 3 0 0 1-3-3z"/><path d="M8 12h4"/></svg>',
    sleep:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    diaper:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v3a9 9 0 0 1-9 9 9 9 0 0 1-9-9z"/><path d="M3 6c4 1.5 14 1.5 18 0"/></svg>'
  };
  function colorFor(t2) { return t2==="feed" ? "var(--feed)" : t2==="sleep" ? "var(--sleep)" : "var(--diaper)"; }
  function tint(t2) { return "color-mix(in srgb, " + colorFor(t2) + " 18%, transparent)"; }

  function labelFor(ev) {
    if (ev.type==="feed") return ev.sub==="nursing"?t("nursing"):ev.sub==="bottle"?t("bottle"):ev.sub==="solids"?t("solids"):ev.sub==="pump"?"Pump":t("feed");
    return ev.type==="sleep"?t("sleep"):ev.type==="diaper"?t("diaper"):"Event";
  }
  function detailFor(ev) {
    if (ev.type==="feed") {
      if (ev.sub==="nursing") return (ev.side==="R"?t("right"):t("left")) + (ev.end?" · "+durShort(ev.end-ev.start):"");
      if (ev.sub==="bottle") return ev.amount + " " + (ev.unit||"ml");
      if (ev.sub==="solids") return ev.note || t("solids");
    }
    if (ev.type==="sleep") return ev.end ? durShort(ev.end-ev.start) : "…";
    if (ev.type==="diaper") return ev.sub==="wet"?t("wet"):ev.sub==="dirty"?t("dirty"):t("mixed");
    return "";
  }

  /* ---------- RENDER ---------- */
  function render() {
    var app = $("#app"); app.classList.toggle("simple", simpleOn());
    var hh = new Date().getHours();
    $("#greet").textContent = hh<5?t("g_night"):hh<12?t("g_morning"):hh<17?t("g_afternoon"):hh<22?t("g_evening"):t("g_night");
    $("#babyName").textContent = db.baby.name || "Baby";
    $("#babyAge").textContent = ageText() ? "· "+ageText() : "";
    $("#tlDate").textContent = new Date().toLocaleDateString([], { weekday:"short", month:"short", day:"numeric" });

    // static labels via i18n
    $("#feedLbl").textContent = t("feed"); $("#diaperLbl").textContent = t("diaper"); $("#moreLbl").textContent = t("more");
    $("#nudgeLead").textContent = t("next_up"); $("#tlTitle").textContent = t("todays_rhythm"); $("#raTitle").textContent = t("recent");
    $("#asLabel").textContent = t("logging_as");

    renderCaregiverUI();
    renderStats();
    renderNudge();
    renderTimeline();
    renderList();
    renderTimer();
  }

  function renderCaregiverUI() {
    var fam = $("#famAvatars"); fam.innerHTML = "";
    db.care.forEach(function (c) {
      var a = document.createElement("span"); a.className = "av"; a.style.background = c.color; a.textContent = c.badge; a.title = c.name; fam.appendChild(a);
    });
    $("#asName").textContent = cur().name;
    var sb = $("#simpleBanner");
    if (simpleOn()) { sb.classList.add("on"); $("#sbAv").style.background = cur().color; $("#sbAv").textContent = cur().badge;
      $("#sbTxt").textContent = t("simple_mode") + " — " + t("logging_as").toLowerCase() + " " + cur().name; $("#sbBack").textContent = t("switch_back"); }
    else sb.classList.remove("on");
  }

  function lastOf(type, sub) {
    var f = db.events.filter(function (x) { return x.type===type && (!sub || x.sub===sub); });
    return f.length ? f[f.length-1] : null;
  }
  function tileFor(key) {
    var t2 = todays();
    if (key==="lastFeed") { var lf=lastOf("feed"); return tile("feed", t("last_feed"), lf?shortAgo(lf.start):"—", lf?labelFor(lf)+" · "+fmtClock(lf.start):"—"); }
    if (key==="feedVol") {
      var bs = t2.filter(function (x){return x.type==="feed"&&x.sub==="bottle";});
      var unit = bs.length?bs[bs.length-1].unit:(db.pref.unit||"ml");
      var total = bs.filter(function(x){return (x.unit||"ml")===unit;}).reduce(function(a,x){return a+(+x.amount||0);},0);
      return tile("feed", t("fed_today"), '<span class="tnum">'+(unit==="oz"?total.toFixed(1):total)+"</span> <small>"+unit+"</small>", bs.length+" bottles");
    }
    if (key==="sleep") { var ms=t2.filter(function(x){return x.type==="sleep"&&x.end;}).reduce(function(a,x){return a+(x.end-x.start);},0);
      return tile("sleep", t("sleep_today"), ms?'<span class="tnum">'+durShort(ms)+"</span>":"0m", t2.filter(function(x){return x.type==="sleep";}).length+" sleeps"); }
    if (key==="state") {
      if (db.timer && db.timer.type==="sleep") return tile("sleep", t("right_now"), t("asleep"), '<span class="tnum">'+dur(Date.now()-db.timer.start)+"</span>");
      if (db.timer && db.timer.type==="feed") return tile("feed", t("right_now"), t("nursing"), '<span class="tnum">'+dur(Date.now()-db.timer.start)+"</span>");
      var ls=lastOf("sleep"); return tile("sleep", t("right_now"), t("awake"), ls&&ls.end?"since "+fmtClock(ls.end):"—");
    }
    if (key==="diapers") { var ds=t2.filter(function(x){return x.type==="diaper";}); var w=ds.filter(function(x){return x.sub!=="dirty";}).length, dd=ds.filter(function(x){return x.sub!=="wet";}).length;
      return tile("diaper", t("diapers"), '<span class="tnum">'+ds.length+"</span>", w+" wet · "+dd+" dirty"); }
    if (key==="lastDiaper") { var ld=lastOf("diaper"); return tile("diaper", t("last_diaper"), ld?shortAgo(ld.start):"—", ld?detailFor(ld)+" · "+fmtClock(ld.start):"—"); }
    return "";
  }
  function shortAgo(ts) { var m=Math.floor((Date.now()-ts)/60000);
    if (m<1) return t("now"); if (m<60) return '<span class="tnum">'+m+'</span><small>m</small>';
    var h=Math.floor(m/60), r=m%60; return '<span class="tnum">'+h+'</span><small>h </small><span class="tnum">'+r+'</span><small>m</small>'; }
  function tile(type, cap, val, sub) {
    return '<div class="tile"><div class="cap"><span class="dot" style="background:'+colorFor(type)+'"></span>'+cap+'</div><div class="val">'+val+'</div><div class="sub">'+sub+'</div></div>';
  }
  function renderStats() { $("#stats").innerHTML = (db.pref.tiles||["lastFeed","sleep","diapers"]).slice(0,3).map(tileFor).join(""); }

  function renderNudge() {
    var feeds = db.events.filter(function (x){return x.type==="feed";}); var el=$("#nudge");
    if (feeds.length<2) { el.hidden=true; return; } el.hidden=false;

  /* ---- reusable "when" (back-date) control ---- */
  function whenControl() {
    return '<h4>'+t("when")+'</h4><div class="whenrow" id="whenRow">'+
      '<button data-off="0" aria-pressed="true">'+t("now")+'</button>'+
      '<button data-off="15">15m</button><button data-off="30">30m</button><button data-off="60">1h</button>'+
      '<input type="time" id="whenTime" aria-label="Custom time" /></div>';
  }
  function wireWhen(root) {
    var offset={v:0}; var custom=null;
    root.querySelectorAll("#whenRow [data-off]").forEach(function (b){ b.addEventListener("click", function(){
      root.querySelectorAll("#whenRow [data-off]").forEach(function(x){x.setAttribute("aria-pressed", x===b?"true":"false");});
      offset.v=+b.dataset.off; custom=null; var ti=root.querySelector("#whenTime"); if(ti) ti.value="";
    }); });
    var ti=root.querySelector("#whenTime");
    if (ti) ti.addEventListener("change", function(){ if (!ti.value){ custom=null; return; }
      root.querySelectorAll("#whenRow [data-off]").forEach(function(x){x.setAttribute("aria-pressed","false");});
      var p=ti.value.split(":"), d=new Date(); d.setHours(+p[0], +p[1], 0, 0); if (d.getTime()>Date.now()) d.setDate(d.getDate()-1); custom=d.getTime();
    });
    return function resolve(){ return custom!=null ? custom : Date.now() - offset.v*60000; };
  }

          whenControl()+'<button class="cta" id="logBottle">'+t("log_bottle")+'</button>';

  $("#babyBtn").addEventListener("click", babySheet);
  $("#shareBtn").addEventListener("click", shareSheet);
  $("#setBtn").addEventListener("click", settingsSheet);
  $("#logAsBtn").addEventListener("click", switchSheet);
  $("#sbBack").addEventListener("click", function(){ db.cur="you"; persist(); render(); });
  $("#actSleep").addEventListener("click", function(){ if (db.timer&&db.timer.type==="sleep") stopTimer(); else if (db.timer) toast("Stop the nursing timer first"); else startTimer("sleep"); });
  $("#resetBtn").addEventListener("click", function(){ if (!confirm("Reset the demo? This clears all data on this device.")) return;
    Object.keys(K).forEach(function(k){ localStorage.removeItem(K[k]); });
    db.care=DEFAULT_CARE.map(function(c){return Object.assign({},c);}); db.cur="you"; db.pref={unit:"ml",side:"L",tiles:["lastFeed","sleep","diapers"]};
    db.baby={name:"Baby",dob:Date.now()-86400000*84}; db.timer=null; db.events=seed(); persist(); render(); toast("Demo reset", null, null, true); });

  render();
  setInterval(tickTimer, 1000);
  setInterval(render, 60000);
})();
</script>
