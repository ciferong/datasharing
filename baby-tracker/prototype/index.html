<title>Lull — Baby Tracker (Prototype)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<style>
  /* ============ tokens — "a small light in a dark room" ============ */
  :root {
    --bg: #e9edf6; --bg-glow: #f6e9d6;
    --s0: #f2f4fa; --s1: #ffffff; --s2: #f6f8fd;
    --text: #1a2138; --dim: #4a5470; --faint: #8b93ad;
    --gold: #b97f1e; --gold-soft: #c98f2e; --gold-ink: #2a1c00;
    --feed: #c94f22; --sleep: #5a49c8; --diaper: #0e8a70; --good: #178a5e;
    --glow: 0 0 0 transparent;
    --lit: inset 0 1px 0 rgba(255,255,255,.9);
    --shadow: 0 8px 26px rgba(30,40,70,.10);
    --sheet-shadow: 0 -14px 44px rgba(20,28,55,.20);
    --ring: rgba(185,127,30,.55);
    --scrim: rgba(20,26,48,.45);
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #0e1424; --bg-glow: #1b2445;
    --s0: #121a2e; --s1: #182238; --s2: #1f2a44;
    --text: #eef1f8; --dim: #c4ccdf; --faint: #93a0bf;
    --gold: #f0c07a; --gold-soft: #f7d9a8; --gold-ink: #241700;
    --feed: #ff9e7d; --sleep: #a89bff; --diaper: #52cfb2; --good: #58d69e;
    --glow: 0 0 18px rgba(240,192,122,.28);
    --lit: inset 0 1px 0 rgba(255,255,255,.07);
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    --sheet-shadow: 0 -16px 48px rgba(0,0,0,.55);
    --ring: rgba(240,192,122,.5);
    --scrim: rgba(4,8,18,.55);
  } }
  :root[data-theme="light"] {
    --bg: #e9edf6; --bg-glow: #f6e9d6; --s0: #f2f4fa; --s1: #ffffff; --s2: #f6f8fd;
    --text: #1a2138; --dim: #4a5470; --faint: #8b93ad;
    --gold: #b97f1e; --gold-soft: #c98f2e; --gold-ink: #2a1c00;
    --feed: #c94f22; --sleep: #5a49c8; --diaper: #0e8a70; --good: #178a5e;
    --glow: 0 0 0 transparent; --lit: inset 0 1px 0 rgba(255,255,255,.9);
    --shadow: 0 8px 26px rgba(30,40,70,.10); --sheet-shadow: 0 -14px 44px rgba(20,28,55,.20);
    --ring: rgba(185,127,30,.55); --scrim: rgba(20,26,48,.45);
  }
  :root[data-theme="dark"] {
    --bg: #0e1424; --bg-glow: #1b2445; --s0: #121a2e; --s1: #182238; --s2: #1f2a44;
    --text: #eef1f8; --dim: #c4ccdf; --faint: #93a0bf;
    --gold: #f0c07a; --gold-soft: #f7d9a8; --gold-ink: #241700;
    --feed: #ff9e7d; --sleep: #a89bff; --diaper: #52cfb2; --good: #58d69e;
    --glow: 0 0 18px rgba(240,192,122,.28); --lit: inset 0 1px 0 rgba(255,255,255,.07);
    --shadow: 0 10px 30px rgba(0,0,0,.35); --sheet-shadow: 0 -16px 48px rgba(0,0,0,.55);
    --ring: rgba(240,192,122,.5); --scrim: rgba(4,8,18,.55);
  }
  /* time-of-day tint (dark ground only, subtle) */
  body[data-tod="dusk"]   { --bg-tint: rgba(90,73,200,.10); }
  body[data-tod="night"]  { --bg-tint: rgba(20,30,70,.0); }
  body[data-tod="predawn"]{ --bg-tint: rgba(240,192,122,.06); }
  body[data-tod="day"]    { --bg-tint: rgba(240,192,122,.04); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      linear-gradient(180deg, var(--bg-tint, transparent), transparent 40%),
      radial-gradient(130% 55% at 50% -10%, var(--bg-glow), transparent 58%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.45; min-height: 100dvh;
  }
  .disp { font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; }
  .tnum { font-variant-numeric: tabular-nums; }
  button { touch-action: manipulation; }

  .app { max-width: 480px; margin: 0 auto; min-height: 100dvh;
    padding: 18px 20px calc(196px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 22px; }

  /* ============ header — quiet ============ */
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .baby-btn { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 1px; border-radius: 10px; min-height: 44px; justify-content: center; }
  .baby-btn .hi { font-size: 13px; color: var(--faint); }
  .baby-btn .nm { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .baby-btn .nm .age { font-size: 13px; font-weight: 600; color: var(--faint); margin-left: 6px; }
  .baby-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
  .hbtns { display: flex; gap: 6px; align-items: center; }
  .whochip { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 12px 8px 8px; border-radius: 22px; background: var(--s1); box-shadow: var(--lit), var(--shadow);
    font-size: 13px; font-weight: 700; min-height: 44px; }
  .whochip:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 800; color: #fff; flex: none; }
  .icobtn { all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
    color: var(--dim); }
  .icobtn svg { width: 21px; height: 21px; }
  .icobtn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  .simplebanner { display: none; align-items: center; gap: 10px;
    background: color-mix(in srgb, var(--diaper) 14%, var(--s1));
    border-radius: 14px; padding: 11px 13px; box-shadow: var(--lit); }
  .simplebanner.on { display: flex; }
  .simplebanner .txt { flex: 1; font-size: 13.5px; font-weight: 600; }
  .simplebanner button { all: unset; cursor: pointer; font-size: 13.5px; font-weight: 700; color: var(--diaper); padding: 8px; }

  /* ============ hero — the one answer ============ */
  .hero { display: flex; flex-direction: column; gap: 4px; }
  .hero .lead { font-size: 13px; font-weight: 600; color: var(--faint); letter-spacing: .02em; }
  .hero .big { font-size: 40px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .hero .big b { color: var(--gold); font-weight: 700; text-shadow: var(--glow); }
  .hero .next { font-size: 14.5px; color: var(--dim); margin-top: 2px; }
  .hero .next b { color: var(--gold); font-weight: 700; }
  .hero .why { font-size: 13px; color: var(--faint); }

  /* ============ ribbon — signature surface ============ */
  .ribbon { background: var(--s1); border-radius: 20px; padding: 16px 16px 12px; box-shadow: var(--lit), var(--shadow); }
  .ribbon .rhead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .ribbon .rhead h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--dim); }
  .ribbon .rhead .meta { font-size: 13px; color: var(--faint); }
  .timeline { position: relative; height: 64px; }
  .tl-track { position: absolute; left: 0; right: 0; top: 16px; height: 32px;
    background: var(--s0); border-radius: 10px; box-shadow: var(--lit); }
  .tl-grid { position: absolute; top: 16px; height: 32px; width: 1px; background: color-mix(in srgb, var(--faint) 22%, transparent); }
  .tl-hour { position: absolute; top: 52px; transform: translateX(-50%); font-size: 12px; color: var(--faint); }
  .tl-now { position: absolute; top: 6px; height: 50px; width: 2px; background: var(--gold); border-radius: 2px; z-index: 4; box-shadow: 0 0 10px var(--gold); }
  .tl-moon { position: absolute; top: 0; width: 14px; height: 14px; transform: translateX(-50%); z-index: 5; color: var(--gold); filter: drop-shadow(0 0 6px var(--gold)); }
  .tl-bar { position: absolute; top: 20px; height: 24px; border-radius: 7px; z-index: 2; background: var(--sleep); }
  .tl-feed { position: absolute; top: 23px; width: 13px; height: 13px; border-radius: 50%; transform: translateX(-50%); z-index: 3;
    background: var(--feed); box-shadow: 0 0 0 2px var(--s1); }
  .tl-diaper { position: absolute; top: 24px; width: 11px; height: 11px; transform: translateX(-50%) rotate(45deg); z-index: 3;
    background: var(--diaper); border-radius: 3px; box-shadow: 0 0 0 2px var(--s1); }
  .legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); }
  .legend .lg-feed { width: 10px; height: 10px; border-radius: 50%; background: var(--feed); }
  .legend .lg-sleep { width: 14px; height: 8px; border-radius: 3px; background: var(--sleep); }
  .legend .lg-diaper { width: 9px; height: 9px; border-radius: 2.5px; background: var(--diaper); transform: rotate(45deg); }

  /* quiet stats strip — no cards */
  .strip { display: flex; gap: 6px; justify-content: space-between; }
  .stat { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .stat .k { font-size: 12px; font-weight: 600; color: var(--faint); display: flex; align-items: center; gap: 5px; }
  .stat .k i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .stat .v { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .stat .v small { font-size: 12px; color: var(--dim); font-weight: 600; }
  .stat .s { font-size: 12px; color: var(--faint); }

  /* ============ recent — borderless list ============ */
  .recent h2 { margin: 0 0 6px; font-size: 13px; font-weight: 700; color: var(--dim);
    display: flex; justify-content: space-between; align-items: baseline; }
  .recent h2 .seeall { all: unset; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--gold); padding: 4px; }
  .recent h2 .seeall:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-height: 52px; }
  .rowbtn { all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; border-radius: 12px; min-height: 44px; }
  .rowbtn:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
  .glyph { width: 40px; height: 40px; border-radius: 13px; flex: none; display: grid; place-items: center; position: relative;
    background: var(--s1); box-shadow: var(--lit), var(--shadow); }
  .glyph svg { width: 20px; height: 20px; }
  .glyph .who { position: absolute; right: -5px; bottom: -5px; width: 18px; height: 18px; border-radius: 50%;
    display: grid; place-items: center; font-size: 9.5px; font-weight: 800; color: #fff; box-shadow: 0 0 0 2px var(--bg); }
  .row .t1 { font-size: 15px; font-weight: 650; }
  .row .t2 { font-size: 13px; color: var(--faint); }
  .row .when { font-size: 13px; color: var(--dim); text-align: right; white-space: nowrap; }
  .row .when .ago { color: var(--faint); }
  .empty { text-align: center; color: var(--faint); font-size: 14px; padding: 18px 0 4px; }
  .empty .big { font-size: 26px; margin-bottom: 6px; }

  /* ============ timer banner — the whole UI while running ============ */
  .timerbar { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(104px + env(safe-area-inset-bottom)); z-index: 40;
    width: min(444px, calc(100vw - 32px)); display: none; align-items: center; gap: 12px;
    background: var(--s2); border-radius: 20px; padding: 13px 12px 13px 18px;
    box-shadow: var(--lit), var(--shadow), var(--glow); }
  .timerbar.on { display: flex; }
  .timerbar .pulse { width: 12px; height: 12px; border-radius: 50%; flex: none; animation: pulse 1.8s ease-in-out infinite; }
  .timerbar .lab { flex: 1; min-width: 0; }
  .timerbar .k { font-size: 12.5px; color: var(--dim); font-weight: 650; }
  .timerbar .v { font-size: 34px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; text-shadow: var(--glow); }
  .timerbar .side { all: unset; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--feed);
    padding: 12px 12px; border-radius: 12px; min-height: 44px; box-sizing: border-box; }
  .timerbar .stop { all: unset; cursor: pointer; font-size: 15px; font-weight: 800; color: var(--gold-ink);
    background: var(--gold); padding: 13px 20px; border-radius: 14px; min-height: 48px; box-sizing: border-box;
    box-shadow: 0 0 14px color-mix(in srgb, var(--gold) 45%, transparent); }
  .timerbar .side:focus-visible, .timerbar .stop:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .4; transform: scale(.82);} }

  /* ============ action bar — stable, big, 1-tap ============ */
  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); display: flex; justify-content: center;
    background: linear-gradient(180deg, transparent, var(--bg) 34%); }
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; width: min(480px, 100%); }
  .act { all: unset; cursor: pointer; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 14px 4px 12px; border-radius: 20px; font-weight: 700; font-size: 13px; min-height: 74px;
    background: var(--s1); box-shadow: var(--lit), var(--shadow);
    transition: transform .08s ease; color: var(--text); position: relative; user-select: none; -webkit-user-select: none; }
  .act:active { transform: translateY(2px) scale(.985); }
  .act:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .act svg { width: 26px; height: 26px; }
  .act.nurse { color: var(--feed); } .act.bottle { color: var(--feed); }
  .act.sleep { color: var(--sleep); } .act.diaper { color: var(--diaper); }
  .act .lbl { color: var(--text); }
  .act .sub2 { font-size: 10.5px; font-weight: 600; color: var(--faint); margin-top: -3px; }
  .act.armed { background: color-mix(in srgb, var(--sleep) 22%, var(--s1)); box-shadow: var(--lit), var(--shadow), 0 0 14px color-mix(in srgb, var(--sleep) 40%, transparent); }
  .app.simple ~ .actionbar .act, body.simple .act { min-height: 92px; font-size: 16px; }
  body.simple .act svg { width: 34px; height: 34px; }
  body.simple .act .sub2 { display: none; }

  /* hold-progress hint on long-pressable buttons */
  .act .holdhint { position: absolute; top: 7px; right: 9px; font-size: 9px; font-weight: 800; color: var(--faint); letter-spacing: .05em; }
  body.simple .act .holdhint { display: none; }

  /* ============ sheets ============ */
  .scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%); z-index: 51; width: min(480px, 100%);
    background: var(--s1); border-radius: 26px 26px 0 0; box-shadow: var(--sheet-shadow), var(--lit);
    padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); transition: transform .26s cubic-bezier(.22,.8,.28,1);
    max-height: 88dvh; overflow-y: auto; }
  .sheet.on { transform: translate(-50%, 0); }
  .grip { width: 40px; height: 4px; border-radius: 3px; background: color-mix(in srgb, var(--faint) 40%, transparent); margin: 4px auto 14px; }
  .sheet h3 { margin: 0 0 3px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .sheet .sub { margin: 0 0 16px; font-size: 13.5px; color: var(--faint); }
  .sheet h4 { margin: 16px 0 9px; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .seg.three { grid-template-columns: repeat(3, 1fr); }
  .chip { all: unset; cursor: pointer; box-sizing: border-box; text-align: center; padding: 17px 8px; border-radius: 16px;
    font-size: 15px; font-weight: 700; background: var(--s2); box-shadow: var(--lit); color: var(--text);
    display: flex; flex-direction: column; align-items: center; gap: 7px; min-height: 64px; }
  .chip svg { width: 24px; height: 24px; }
  .chip:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .chip[aria-pressed="true"] { box-shadow: var(--lit), inset 0 0 0 1.5px currentColor; background: color-mix(in srgb, currentColor 13%, var(--s1)); }
  .chip.f { color: var(--feed); } .chip.s { color: var(--sleep); } .chip.d { color: var(--diaper); }
  .chip .cl { color: var(--text); font-size: 15px; }
  .chip small { color: var(--faint); font-size: 12px; font-weight: 600; }

  .whenrow { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
  .whenrow button { all: unset; cursor: pointer; padding: 11px 14px; border-radius: 12px; font-size: 13.5px; font-weight: 700;
    background: var(--s2); box-shadow: var(--lit); color: var(--dim); min-height: 44px; box-sizing: border-box; }
  .whenrow button[aria-pressed="true"] { color: var(--text); box-shadow: var(--lit), inset 0 0 0 1.5px var(--gold); background: color-mix(in srgb, var(--gold) 11%, var(--s1)); }
  .whenrow input[type="time"] { font-family: inherit; font-size: 13.5px; padding: 9px 11px; border-radius: 12px;
    background: var(--s2); border: none; box-shadow: var(--lit); color: var(--text); min-height: 44px; box-sizing: border-box; }

  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .presets button { all: unset; cursor: pointer; padding: 12px 16px; border-radius: 13px; font-size: 15px; font-weight: 700;
    background: var(--s2); box-shadow: var(--lit); color: var(--text); min-height: 46px; box-sizing: border-box; }
  .presets button[aria-pressed="true"] { box-shadow: var(--lit), inset 0 0 0 1.5px var(--feed); background: color-mix(in srgb, var(--feed) 11%, var(--s1)); }
  .presets button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--s2);
    box-shadow: var(--lit); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; }
  .stepper .amt { font-size: 32px; font-weight: 700; letter-spacing: -.02em; }
  .stepper .amt small { font-size: 15px; color: var(--dim); font-weight: 600; }
  .stepper .pm { display: flex; gap: 8px; }
  .rnd { all: unset; cursor: pointer; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
    font-size: 24px; font-weight: 700; background: var(--s1); box-shadow: var(--lit), var(--shadow); color: var(--text); }
  .rnd:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .rnd:active { transform: scale(.94); }

  .field { width: 100%; box-sizing: border-box; background: var(--s2); border: none; box-shadow: var(--lit); color: var(--text);
    border-radius: 14px; padding: 14px; font-size: 15px; margin-bottom: 14px; font-family: inherit; min-height: 48px; }
  .field:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
  label.lbl { font-size: 12.5px; color: var(--faint); font-weight: 600; display: block; margin: -6px 0 6px; }

  .cta { all: unset; cursor: pointer; box-sizing: border-box; width: 100%; text-align: center; padding: 16px; border-radius: 16px;
    font-size: 16px; font-weight: 800; background: var(--gold); color: var(--gold-ink); min-height: 52px;
    box-shadow: 0 0 16px color-mix(in srgb, var(--gold) 35%, transparent); }
  .cta:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .cta:active { transform: translateY(1px); }
  .cta.ghost { background: var(--s2); color: var(--text); box-shadow: var(--lit); }
  .cta.danger { background: color-mix(in srgb, var(--feed) 13%, var(--s1)); color: var(--feed); box-shadow: var(--lit); }
  .ctarow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .unitrow { display: flex; gap: 8px; margin-bottom: 14px; }
  .unitrow button { all: unset; cursor: pointer; padding: 10px 16px; border-radius: 11px; font-size: 13.5px; font-weight: 700;
    background: var(--s2); box-shadow: var(--lit); color: var(--dim); min-height: 44px; box-sizing: border-box; }
  .unitrow button[aria-pressed="true"] { color: var(--text); box-shadow: var(--lit), inset 0 0 0 1.5px var(--gold); }

  .member { display: flex; align-items: center; gap: 12px; padding: 13px 0; }
  .member + .member { border-top: 1px solid color-mix(in srgb, var(--faint) 18%, transparent); }
  .member .info { flex: 1; min-width: 0; }
  .member .nm { font-size: 15px; font-weight: 700; }
  .member .rl { font-size: 13px; color: var(--faint); }
  .member .badges { display: flex; gap: 6px; margin-top: 3px; }
  .member .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; background: var(--s2); color: var(--dim); }
  .logas { all: unset; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--gold);
    padding: 11px 13px; border-radius: 11px; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--gold) 40%, transparent); min-height: 44px; box-sizing: border-box; }
  .logas[data-cur="1"] { color: var(--good); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--good) 45%, transparent); cursor: default; }
  .logas:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  .invite { display: flex; align-items: center; gap: 10px; background: var(--s2); box-shadow: var(--lit);

<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var K = { ev:"lull.events.v5", baby:"lull.baby.v5", timer:"lull.timer.v5", pref:"lull.pref.v5", care:"lull.care.v5", cur:"lull.cur.v5" };

  var I18N = {
    en: { g_morning:"Good morning", g_afternoon:"Good afternoon", g_evening:"Good evening", g_night:"Late night",
      nurse:"Nurse", bottle:"Bottle", sleep:"Sleep", diaper:"Diaper", wake:"Wake",
      left:"Left", right:"Right", wet:"Wet", dirty:"Dirty", mixed:"Mixed", solids:"Solids", nursing:"Nursing",
      last_fed:"Last fed", ago:"ago", next_around:"Next feed around", based_on:"Based on a typical", gap:"gap between recent feeds",
      todays_rhythm:"Today's rhythm", recent:"Recent", now:"Now", asleep:"Asleep", awake:"Awake",
      sleep_today:"Sleep today", diapers:"Diapers", fed_today:"Fed today", last_diaper:"Last diaper", right_now:"Right now",
      saved:"saved", when:"When", today:"today", tap_start:"tap = start", tap_wet:"tap = wet",
      simple_mode:"Simple mode", switch_back:"Switch back", logging_as:"logging as",

      log_bottle:"Log bottle", log_solids:"Log solids", choose_diaper:"Log a diaper", onetap:"One tap.",

    tl: { g_morning:"Magandang umaga", g_afternoon:"Magandang hapon", g_evening:"Magandang gabi", g_night:"Gabing-gabi na",
      nurse:"Pasuso", bottle:"Bote", sleep:"Tulog", diaper:"Lampin", wake:"Gising",
      left:"Kaliwa", right:"Kanan", wet:"Basa", dirty:"Dumi", mixed:"Basa at dumi", solids:"Pagkain", nursing:"Pasuso",
      last_fed:"Huling pakain", ago:"ang nakalipas", next_around:"Susunod na pakain bandang", based_on:"Batay sa karaniwang", gap:"pagitan ng pakain",
      todays_rhythm:"Takbo ngayong araw", recent:"Mga huling ginawa", now:"Ngayon", asleep:"Tulog", awake:"Gising",
      sleep_today:"Tulog ngayon", diapers:"Lampin", fed_today:"Nainom ngayon", last_diaper:"Huling lampin", right_now:"Ngayon mismo",
      saved:"na-save", when:"Kailan", today:"ngayon", tap_start:"pindot = simula", tap_wet:"pindot = basa",
      simple_mode:"Simpleng mode", switch_back:"Bumalik", logging_as:"nagre-record bilang",
      nothing:"Wala pang record", tapbelow:"Pindutin ang buton sa ibaba",
      log_bottle:"I-record ang bote", log_solids:"I-record ang pagkain", choose_diaper:"Mag-record ng lampin", onetap:"Isang pindot lang.",
      never_paywalled:"Libre magpakailanman — hindi kailanman babayaran ang pagbabahagi." }
  };

  var DEFAULT_CARE = [
    { id:"you",   name:"You",   badge:"Y", color:"#b97f1e", role:"Owner",   simple:false, lang:"en" },
    { id:"grace", name:"Grace", badge:"G", color:"#0e8a70", role:"Helper",  simple:true,  lang:"tl" },
    { id:"sam",   name:"Sam",   badge:"S", color:"#5a49c8", role:"Partner", simple:false, lang:"en" }
  ];

  var db = {
    events: load(K.ev, null), baby: load(K.baby, null), timer: load(K.timer, null),
    pref: load(K.pref, { unit:"ml", side:"L", lastAmount:null, stats:["sleep","diapers","feedVol"] }),
    care: load(K.care, null), cur: load(K.cur, "you")
  };
  var lastDeleted = null, toastTimer = null, showAll = false;

  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function saveK(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function persist() { saveK(K.ev, db.events); saveK(K.baby, db.baby); saveK(K.timer, db.timer); saveK(K.pref, db.pref); saveK(K.care, db.care); saveK(K.cur, db.cur); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p || 18); } catch (e) {} }

  if (!db.care) db.care = DEFAULT_CARE.map(function (c) { return Object.assign({}, c); });
  if (!db.pref.stats) db.pref.stats = ["sleep","diapers","feedVol"];
  if (db.events === null) { db.baby = { name:"Baby", dob: Date.now() - 86400000 * 84 }; db.events = seed(); persist(); }
  if (!db.baby) db.baby = { name:"Baby", dob:null };

  function seed() {
    var now = Date.now(), H = 3600000, M = 60000, e = [];
    function a(o){ e.push(o); }
    a({ id:uid(), type:"feed", sub:"nursing", side:"L", by:"sam",   start: now-6.7*H, end: now-6.7*H+16*M });
    a({ id:uid(), type:"diaper", sub:"wet",   by:"sam",   start: now-6.4*H });
    a({ id:uid(), type:"sleep",               by:"you",   start: now-6.1*H, end: now-4.2*H });
    a({ id:uid(), type:"feed", sub:"bottle", amount:120, unit:"ml", by:"grace", start: now-4.0*H });
    a({ id:uid(), type:"diaper", sub:"dirty", by:"grace", start: now-3.6*H });
    a({ id:uid(), type:"sleep",               by:"grace", start: now-3.1*H, end: now-1.7*H });
    a({ id:uid(), type:"feed", sub:"nursing", side:"R", by:"you", start: now-1.5*H, end: now-1.5*H+19*M });
    a({ id:uid(), type:"diaper", sub:"mixed", by:"grace", start: now-1.1*H });
    return e.sort(function (x,y){ return x.start-y.start; });
  }

  function cur() { return db.care.filter(function (c){ return c.id===db.cur; })[0] || db.care[0]; }
  function careById(id) { return db.care.filter(function (c){ return c.id===id; })[0] || db.care[0]; }
  function lang() { return cur().lang || "en"; }
  function simpleOn() { return !!cur().simple; }
  function t(key) { var L=I18N[lang()]||I18N.en; return L[key]!=null?L[key]:(I18N.en[key]!=null?I18N.en[key]:key); }

  function fmtClock(ts) { return new Date(ts).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }); }
  function agoStr(ts) { var s=Math.max(0,Math.floor((Date.now()-ts)/1000));
    if (s<60) return "now"; var m=Math.floor(s/60); if (m<60) return m+"m";
    var h=Math.floor(m/60), r=m%60; return r?h+"h "+r+"m":h+"h"; }
  function dur(ms) { var s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
    return h>0 ? h+":"+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0") : m+":"+String(ss).padStart(2,"0"); }
  function durShort(ms) { var m=Math.round(ms/60000); if (m<60) return m+"m"; var h=Math.floor(m/60), r=m%60; return r?h+"h "+r+"m":h+"h"; }
  function startOfDay() { var d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
  function todays() { var s=startOfDay(); return db.events.filter(function (x){ return x.start>=s; }); }
  function ageText() { if (!db.baby.dob) return ""; var d=Math.floor((Date.now()-db.baby.dob)/86400000);
    return d<14?d+"d":d<90?Math.floor(d/7)+"w":Math.floor(d/30.4)+"mo"; }

  var ICONS = {
    feed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8M9 2l.6 3M15 2l-.6 3"/><path d="M7.5 8.5c0-1.7 1.2-3 2.7-3.4h3.6c1.5.4 2.7 1.7 2.7 3.4V19a3 3 0 0 1-3 3H10.5a3 3 0 0 1-3-3z"/><path d="M8 12h4"/></svg>',
    sleep:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    diaper:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v3a9 9 0 0 1-9 9 9 9 0 0 1-9-9z"/><path d="M3 6c4 1.5 14 1.5 18 0"/></svg>'
  };
  function colorFor(x) { return x==="feed"?"var(--feed)":x==="sleep"?"var(--sleep)":"var(--diaper)"; }

  function labelFor(ev) {
    if (ev.type==="feed") return ev.sub==="nursing"?t("nursing"):ev.sub==="bottle"?t("bottle"):ev.sub==="solids"?t("solids"):"Feed";
    return ev.type==="sleep"?t("sleep"):ev.type==="diaper"?t("diaper"):"Event";
  }
  function detailFor(ev) {
    if (ev.type==="feed") {
      if (ev.sub==="nursing") return (ev.side==="R"?t("right"):t("left"))+(ev.end?" · "+durShort(ev.end-ev.start):"");
      if (ev.sub==="bottle") return ev.amount+" "+(ev.unit||"ml");
      if (ev.sub==="solids") return ev.note||t("solids");
    }
    if (ev.type==="sleep") return ev.end?durShort(ev.end-ev.start):"…";
    if (ev.type==="diaper") return ev.sub==="wet"?t("wet"):ev.sub==="dirty"?t("dirty"):t("mixed");
    return "";
  }
  function nextSide() {
    var n=db.events.filter(function (x){ return x.type==="feed"&&x.sub==="nursing"&&x.side; });
    if (!n.length) return db.pref.side||"L";
    return n[n.length-1].side==="L"?"R":"L";
  }

  /* ---------- time of day ---------- */
  function tod() { var h=new Date().getHours();
    return h>=17&&h<21?"dusk":h>=21||h<5?"night":h<8?"predawn":"day"; }

  /* ---------- RENDER ---------- */
  function render() {
    document.body.dataset.tod = tod();
    document.body.classList.toggle("simple", simpleOn());
    var hh=new Date().getHours();
    $("#greet").textContent = hh<5?t("g_night"):hh<12?t("g_morning"):hh<17?t("g_afternoon"):hh<22?t("g_evening"):t("g_night");
    $("#babyName").textContent = db.baby.name||"Baby";
    $("#babyAge").textContent = ageText()?"· "+ageText():"";
    $("#tlDate").textContent = new Date().toLocaleDateString([], { weekday:"short", month:"short", day:"numeric" });
    $("#tlTitle").textContent = t("todays_rhythm"); $("#raTitle").textContent = t("recent");
    $("#nurseLbl").textContent=t("nurse"); $("#bottleLbl").textContent=t("bottle");
    $("#diaperLbl").textContent=t("diaper");
    $("#nurseSub").textContent="tap = "+(nextSide()==="R"?t("right"):t("left"));
    $("#bottleSub").textContent = db.pref.lastAmount? "tap = "+db.pref.lastAmount+" "+db.pref.unit : "";
    $("#sleepSub").textContent = db.timer&&db.timer.type==="sleep" ? "" : t("tap_start");
    $("#diaperSub").textContent = t("tap_wet");
    renderWho(); renderHero(); renderTimeline(); renderStrip(); renderList(); renderTimer();
  }

  function renderWho() {
    var c=cur(); $("#whoAv").style.background=c.color; $("#whoAv").textContent=c.badge; $("#whoNm").textContent=c.name;
    var sb=$("#simpleBanner");
    if (simpleOn()) { sb.classList.add("on"); $("#sbAv").style.background=c.color; $("#sbAv").textContent=c.badge;
      $("#sbTxt").textContent=t("simple_mode")+" — "+t("logging_as")+" "+c.name; $("#sbBack").textContent=t("switch_back"); }
    else sb.classList.remove("on");
  }

  function renderHero() {
    var big=$("#heroBig"), lead=$("#heroLead"), next=$("#heroNext"), why=$("#heroWhy");
    if (db.timer) {
      lead.textContent = db.timer.type==="sleep" ? t("asleep") : t("nursing")+" · "+(db.timer.side==="R"?t("right"):t("left"));
      big.innerHTML = '<b>'+dur(Date.now()-db.timer.start)+'</b>';
      next.hidden=true; why.hidden=true; return;
    }
    var feeds=db.events.filter(function (x){ return x.type==="feed"; });
    var lf=feeds.length?feeds[feeds.length-1]:null;
    lead.textContent = t("last_fed");
    big.innerHTML = lf ? '<b>'+agoStr(lf.start)+'</b> '+t("ago") : "—";
    if (feeds.length>=2 && !simpleOn()) {
      var gaps=[]; for (var i=Math.max(1,feeds.length-5);i<feeds.length;i++) gaps.push(feeds[i].start-feeds[i-1].start);
      var avg=gaps.reduce(function (a,b){return a+b;},0)/gaps.length, nx=feeds[feeds.length-1].start+avg, left=nx-Date.now();
      next.hidden=false; why.hidden=false;
      next.innerHTML = left<=0 ? "Likely ready to feed <b>now</b>" : t("next_around")+" <b>"+fmtClock(nx)+"</b> · "+durShort(left);
      why.textContent = t("based_on")+" "+durShort(avg)+" "+t("gap")+".";
    } else { next.hidden=true; why.hidden=true; }
  }

  function renderTimeline() {
    var tl=$("#timeline"); tl.innerHTML=""; var s=startOfDay(), DAY=86400000;
    var tr=document.createElement("div"); tr.className="tl-track"; tl.appendChild(tr);
    [6,12,18].forEach(function (h){ var g=mk("tl-grid"); g.style.left=(h/24*100)+"%"; tl.appendChild(g); });
    [0,6,12,18,24].forEach(function (h){ var lab=mk("tl-hour"); lab.style.left=Math.min(97,Math.max(3,h/24*100))+"%";
      lab.textContent = h===0?"12a":h===12?"12p":h===24?"":(h<12?h+"a":(h-12)+"p"); tl.appendChild(lab); });
    todays().forEach(function (ev){
      var left=(ev.start-s)/DAY*100;
      if (ev.type==="sleep"&&ev.end){ var w=(ev.end-ev.start)/DAY*100; var b=mk("tl-bar"); b.style.left=left+"%"; b.style.width=Math.max(0.9,w)+"%";
        b.setAttribute("aria-label", t("sleep")+", "+fmtClock(ev.start)+"–"+fmtClock(ev.end)); tl.appendChild(b); }
      else if (ev.type==="feed"){ var f=mk("tl-feed"); f.style.left=left+"%"; f.setAttribute("aria-label", labelFor(ev)+", "+fmtClock(ev.start)); tl.appendChild(f); }
      else if (ev.type==="diaper"){ var d=mk("tl-diaper"); d.style.left=left+"%"; d.setAttribute("aria-label", t("diaper")+" "+detailFor(ev)+", "+fmtClock(ev.start)); tl.appendChild(d); }
    });

        out+=stat("sleep", t("sleep_today"), ms?durShort(ms):"0m", ""); }
      if (key==="diapers") { var ds=t2.filter(function (x){return x.type==="diaper";}); var w=ds.filter(function (x){return x.sub!=="dirty";}).length, dd=ds.filter(function (x){return x.sub!=="wet";}).length;

      if (key==="feedVol") { var bs=t2.filter(function (x){return x.type==="feed"&&x.sub==="bottle";});
        var unit=bs.length?(bs[bs.length-1].unit||"ml"):(db.pref.unit||"ml");
        var total=bs.filter(function (x){return (x.unit||"ml")===unit;}).reduce(function (a,x){return a+(+x.amount||0);},0);
        out+=stat("feed", t("fed_today"), (unit==="oz"?String(+total.toFixed(1)):String(total))+" "+unit, bs.length+" ×"); }

  /* ---------- timer ---------- */
  function renderTimer() {
    var bar=$("#timerbar"), sideBtn=$("#timerSide"), aSleep=$("#actSleep");

      bar.classList.add("on"); var isSleep=db.timer.type==="sleep";

      $("#timerK").textContent = (isSleep?t("asleep"):t("nursing")+" · "+(db.timer.side==="R"?t("right"):t("left"))) + " · "+careById(db.timer.by||db.cur).name;

      aSleep.classList.toggle("armed", isSleep);

    } else { bar.classList.remove("on"); $("#sleepLbl").textContent=t("sleep"); aSleep.classList.remove("armed"); sideBtn.hidden=true; }

  function tickTimer() { if (!db.timer) return; var v=dur(Date.now()-db.timer.start); $("#timerV").textContent=v;
    if (db.timer) $("#heroBig").innerHTML='<b>'+v+'</b>'; }
  function startTimer(type, side) {
    if (db.timer) { toast("Stop the current timer first"); return; }
    db.timer={ type:type, side:side||null, start:Date.now(), by:db.cur }; persist(); buzz(); render();
    toast((type==="sleep"?t("sleep"):t("nursing")+" · "+(side==="R"?t("right"):t("left")))+" started", null, null, true);
  }
  function stopTimer() {
    if (!db.timer) return; var tm=db.timer, end=Date.now();
    db.events.push({ id:uid(), type:tm.type, sub:tm.type==="feed"?"nursing":undefined, side:tm.side, by:tm.by||db.cur, start:tm.start, end:end });
    db.timer=null; persist(); buzz([14,60,14]); render();
    var who=careById(db.cur).name;
    toast((tm.type==="sleep"?t("sleep"):(tm.side==="R"?t("right"):t("left")))+" · "+durShort(end-tm.start)+" "+t("saved")+" · "+who, null, null, true);
  }

  $("#timerSide").addEventListener("click", function (){ if (db.timer&&db.timer.type==="feed"){ db.timer.side=db.timer.side==="R"?"L":"R"; persist(); buzz(); renderTimer(); } });

  /* ---------- logging ---------- */
  function addEvent(o, msg) { o.id=uid(); o.by=db.cur; db.events.push(o); db.events.sort(function (a,b){return a.start-b.start;});
    persist(); buzz(); render(); closeSheet();
    toast(msg+" · "+careById(db.cur).name, "Undo", function (){ var i=db.events.indexOf(o); if (i>=0){ db.events.splice(i,1); persist(); render(); } }, true); }
  function logDiaper(sub, when) { addEvent({ type:"diaper", sub:sub, start:when }, t("diaper")+" · "+detailFor({type:"diaper",sub:sub})+" "+t("saved")); }
  function logBottle(amount, unit, when) { db.pref.lastAmount=amount; db.pref.unit=unit; addEvent({ type:"feed", sub:"bottle", amount:amount, unit:unit, start:when }, t("bottle")+" · "+amount+" "+unit+" "+t("saved")); }
  function logSolids(food, when) { addEvent({ type:"feed", sub:"solids", note:food||t("solids"), start:when }, t("solids")+" "+t("saved")); }

  function removeEvent(id) {
    var i=db.events.findIndex(function (x){return x.id===id;}); if (i<0) return;

    toast("Entry deleted", "Undo", function (){ if (lastDeleted){ db.events.push(lastDeleted); db.events.sort(function (a,b){return a.start-b.start;}); lastDeleted=null; persist(); render(); } });

  /* ---------- toast ---------- */
  function toast(msg, actionLabel, actionFn, check) {
    var el=$("#toast"), a=$("#toastAction"), c=$("#toastChk");
    $("#toastMsg").textContent=msg; c.hidden=!check;
    if (actionLabel){ a.hidden=false; a.textContent=actionLabel; a.onclick=function (){ hideToast(); actionFn&&actionFn(); }; }
    else { a.hidden=true; a.onclick=null; }
    el.classList.add("on"); clearTimeout(toastTimer); toastTimer=setTimeout(hideToast, actionLabel?4500:2200);
  }
  function hideToast() { $("#toast").classList.remove("on"); }

  /* ---------- sheet infra ---------- */
  var lastFocus=null;
  function openSheet(html) {
    var sh=$("#sheet"); sh.innerHTML='<div class="grip"></div>'+html; $("#scrim").classList.add("on"); sh.classList.add("on");
    lastFocus=document.activeElement; var f=sh.querySelector("button, input, [tabindex]"); if (f) setTimeout(function (){ f.focus(); }, 60);
  }
  function closeSheet() { $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); if (lastFocus&&lastFocus.focus) lastFocus.focus(); }
  $("#scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e){ if (e.key==="Escape") closeSheet(); });

  function whenControl() {
    return '<h4>'+t("when")+'</h4><div class="whenrow" id="whenRow">'+
      '<button data-off="0" aria-pressed="true">'+t("now")+'</button>'+
      '<button data-off="15">15m</button><button data-off="30">30m</button><button data-off="60">1h</button>'+
      '<input type="time" id="whenTime" aria-label="Custom time" /></div>';
  }
  function wireWhen(root) {
    var offset={v:0}, custom=null;
    root.querySelectorAll("#whenRow [data-off]").forEach(function (b){ b.addEventListener("click", function (){
      root.querySelectorAll("#whenRow [data-off]").forEach(function (x){ x.setAttribute("aria-pressed", x===b?"true":"false"); });
      offset.v=+b.dataset.off; custom=null; var ti=root.querySelector("#whenTime"); if (ti) ti.value="";
    }); });
    var ti=root.querySelector("#whenTime");
    if (ti) ti.addEventListener("change", function (){ if (!ti.value){ custom=null; return; }
      root.querySelectorAll("#whenRow [data-off]").forEach(function (x){ x.setAttribute("aria-pressed","false"); });
      var p=ti.value.split(":"), d=new Date(); d.setHours(+p[0],+p[1],0,0); if (d.getTime()>Date.now()) d.setDate(d.getDate()-1); custom=d.getTime(); });
    return function (){ return custom!=null ? custom : Date.now()-offset.v*60000; };
  }

  /* ---------- long-press helper ---------- */
  function pressable(el, onTap, onHold) {
    var timer=null, held=false;
    function down(e) { held=false; timer=setTimeout(function (){ held=true; buzz(28); onHold(); }, 480); }
    function up(e) { clearTimeout(timer); if (!held && e.type!=="pointerleave" && e.type!=="pointercancel") onTap(); }
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointerleave", function (){ clearTimeout(timer); });
    el.addEventListener("pointercancel", function (){ clearTimeout(timer); });
    el.addEventListener("contextmenu", function (e){ e.preventDefault(); });
    el.addEventListener("keydown", function (e){ if (e.key==="Enter"||e.key===" "){ e.preventDefault(); onTap(); } if (e.key==="h"||e.key==="H") onHold(); });
  }

  /* ---------- sheets ---------- */
  function bottleSheet() {
    var unit=db.pref.unit||"ml", amount=db.pref.lastAmount||(unit==="oz"?4:120);
    openSheet('<h3 id="sheetTitle">'+t("bottle")+'</h3><p class="sub">'+t("onetap")+'</p><div id="tabbody"></div>');
    paint();
    function paint() {
      var body=$("#tabbody");
      var presets = unit==="oz" ? [2,3,4,5,6] : [60,90,120,150,180];
      var step = unit==="oz" ? 0.25 : 10;
      body.innerHTML='<div class="unitrow"><button data-u="ml" aria-pressed="'+(unit==="ml")+'">ml</button><button data-u="oz" aria-pressed="'+(unit==="oz")+'">oz</button></div>'+
        '<div class="presets" id="presets">'+presets.map(function (p){ return '<button data-p="'+p+'" aria-pressed="'+(p===amount)+'">'+p+'</button>'; }).join("")+'</div>'+
        '<div class="stepper"><div class="amt"><span id="amtV" class="tnum disp">'+fmtAmt(amount)+'</span> <small>'+unit+'</small></div>'+
        '<div class="pm"><button class="rnd" id="minus" aria-label="less">−</button><button class="rnd" id="plus" aria-label="more">+</button></div></div>'+
        whenControl()+'<button class="cta" id="logBottle">'+t("log_bottle")+'</button>';
      function fmtAmt(a){ return unit==="oz"?String(+(+a).toFixed(2)):a; }
      function upd(){ $("#amtV").textContent=fmtAmt(amount); body.querySelectorAll("#presets [data-p]").forEach(function (x){ x.setAttribute("aria-pressed", (+x.dataset.p)===amount?"true":"false"); }); }
      body.querySelector("#minus").addEventListener("click", function (){ amount=Math.max(step,+(amount-step).toFixed(2)); upd(); });
      body.querySelector("#plus").addEventListener("click", function (){ amount=+(amount+step).toFixed(2); upd(); });
      body.querySelectorAll("#presets [data-p]").forEach(function (b){ b.addEventListener("click", function (){ amount=+b.dataset.p; upd(); }); });
      body.querySelectorAll("[data-u]").forEach(function (b){ b.addEventListener("click", function (){ unit=b.dataset.u; db.pref.unit=unit; persist(); amount=unit==="oz"?4:120; paint(); }); });
      var resolve=wireWhen(body);
      body.querySelector("#logBottle").addEventListener("click", function (){ logBottle(amount, unit, resolve()); });
    }
  }

  $("#setBtn").addEventListener("click", settingsSheet);
  $("#sbBack").addEventListener("click", function (){ db.cur="you"; persist(); render(); });
  $("#seeAll").addEventListener("click", function (){ showAll=!showAll; renderList(); });
  $("#resetBtn").addEventListener("click", function (){ if (!confirm("Reset the demo? This clears all data on this device.")) return;
    Object.keys(K).forEach(function (k){ localStorage.removeItem(K[k]); });
    db.care=DEFAULT_CARE.map(function (c){ return Object.assign({}, c); }); db.cur="you";
    db.pref={ unit:"ml", side:"L", lastAmount:null, stats:["sleep","diapers","feedVol"] };
    db.baby={ name:"Baby", dob: Date.now()-86400000*84 }; db.timer=null; db.events=seed(); persist(); render(); toast("Demo reset", null, null, true); });

  render();
  setInterval(tickTimer, 1000);
  setInterval(render, 60000);
})();
