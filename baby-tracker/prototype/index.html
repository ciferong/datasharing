<title>Lull — Baby Tracker (Prototype)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<style>
  /* ============ tokens — "cozy dawn": warmer, rounder, friendlier than the
     original midnight-luxury pass, still calm enough to use at 3am. Every
     text/fill pairing below is WCAG-verified (>=4.5:1 normal text, checked
     against every surface it actually sits on — see commit history for the
     computed ratios), not eyeballed. ============ */
  :root {
    --bg: #f7efe6; --bg-glow: #fbe6d3;
    --s0: #f6eee4; --s1: #fffdf9; --s2: #faf2ea;
    --text: #33251c; --dim: #6a5445; --faint: #7a6455;
    --gold: #d17a4e; --gold-text: #a1481f; --toast-accent: #f0a878; --gold-soft: #f0a878; --gold-ink: #2a1405;
    --feed: #b5301f; --sleep: #6b4bcc; --diaper: #0f7a72; --good: #0d7a6e; --danger: #c62233;
    --panel-ink-del: #fff3f2; --panel-ink-edit: #fff8f0;
    --glow: 0 0 0 transparent;
    --lit: inset 0 1px 0 rgba(255,255,255,.9);
    --shadow: 0 8px 26px rgba(70,45,25,.12);
    --sheet-shadow: 0 -14px 44px rgba(60,35,20,.18);
    --ring: rgba(161,72,31,.55);
    --scrim: rgba(51,37,28,.45);
    --ts: 1;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #1f150f; --bg-glow: #34211a;
    --s0: #291c14; --s1: #33251c; --s2: #433126;
    --text: #f7ede4; --dim: #e0c8b6; --faint: #b59a86;
    --gold: #f0a878; --gold-text: #f6bb92; --toast-accent: #a1481f; --gold-soft: #ffcaa0; --gold-ink: #2a1405;
    --feed: #ff8f6b; --sleep: #c3b0ff; --diaper: #5fd6c4; --good: #58d69e; --danger: #ff8a8a;
    --panel-ink-del: #2a1200; --panel-ink-edit: #2a1200;
    --glow: 0 0 18px rgba(240,168,120,.3);
    --lit: inset 0 1px 0 rgba(255,255,255,.07);
    --shadow: 0 10px 30px rgba(0,0,0,.4);
    --sheet-shadow: 0 -16px 48px rgba(0,0,0,.55);
    --ring: rgba(240,168,120,.5);
    --scrim: rgba(6,3,1,.6);
  } }
  :root[data-theme="light"] {
    --bg: #f7efe6; --bg-glow: #fbe6d3; --s0: #f6eee4; --s1: #fffdf9; --s2: #faf2ea;
    --text: #33251c; --dim: #6a5445; --faint: #7a6455;
    --gold: #d17a4e; --gold-text: #a1481f; --toast-accent: #f0a878; --gold-soft: #f0a878; --gold-ink: #2a1405;
    --feed: #b5301f; --sleep: #6b4bcc; --diaper: #0f7a72; --good: #0d7a6e; --danger: #c62233;
    --panel-ink-del: #fff3f2; --panel-ink-edit: #fff8f0;
    --glow: 0 0 0 transparent; --lit: inset 0 1px 0 rgba(255,255,255,.9);
    --shadow: 0 8px 26px rgba(70,45,25,.12); --sheet-shadow: 0 -14px 44px rgba(60,35,20,.18);
    --ring: rgba(161,72,31,.55); --scrim: rgba(51,37,28,.45);
  }
  :root[data-theme="dark"] {
    --bg: #1f150f; --bg-glow: #34211a; --s0: #291c14; --s1: #33251c; --s2: #433126;
    --text: #f7ede4; --dim: #e0c8b6; --faint: #b59a86;
    --gold: #f0a878; --gold-text: #f6bb92; --toast-accent: #a1481f; --gold-soft: #ffcaa0; --gold-ink: #2a1405;
    --feed: #ff8f6b; --sleep: #c3b0ff; --diaper: #5fd6c4; --good: #58d69e; --danger: #ff8a8a;
    --panel-ink-del: #2a1200; --panel-ink-edit: #2a1200;
    --glow: 0 0 18px rgba(240,168,120,.3); --lit: inset 0 1px 0 rgba(255,255,255,.07);
    --shadow: 0 10px 30px rgba(0,0,0,.4); --sheet-shadow: 0 -16px 48px rgba(0,0,0,.55);
    --ring: rgba(240,168,120,.5); --scrim: rgba(6,3,1,.6);
  }
  /* time-of-day tint (dark ground only, subtle) */
  body[data-tod="dusk"]   { --bg-tint: rgba(138,111,240,.10); }
  body[data-tod="night"]  { --bg-tint: rgba(30,20,60,.0); }
  body[data-tod="predawn"]{ --bg-tint: rgba(255,179,122,.07); }
  body[data-tod="day"]    { --bg-tint: rgba(255,179,122,.05); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { zoom: var(--ts, 1); }
  body {
    background:
      linear-gradient(180deg, var(--bg-tint, transparent), transparent 40%),
      radial-gradient(130% 55% at 50% -10%, var(--bg-glow), transparent 58%),
      var(--bg);
    color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.45; min-height: 100dvh;
  }
  .disp { font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; }
  .tnum { font-variant-numeric: tabular-nums; }
  button { touch-action: manipulation; }

  .app { max-width: 480px; margin: 0 auto; min-height: 100dvh;
    padding: 20px 22px calc(206px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 26px; }

  /* ============ header — quiet ============ */
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .baby-btn { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 2px; border-radius: 14px; min-height: 44px; justify-content: center; }
  .baby-btn .hi { font-size: 15px; color: var(--faint); }
  .baby-btn .nm { font-size: 23px; font-weight: 700; letter-spacing: -.01em; }
  .baby-btn .nm .age { font-size: 14px; font-weight: 600; color: var(--faint); margin-left: 6px; }
  .baby-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
  .hbtns { display: flex; gap: 6px; align-items: center; }
  .whochip { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px 9px 9px; border-radius: 24px; background: var(--s1); box-shadow: var(--lit), var(--shadow);
    font-size: 14.5px; font-weight: 700; min-height: 46px; }
  .whochip:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-size: 13px; font-weight: 800; color: #fff; flex: none; }
  .icobtn { all: unset; cursor: pointer; width: 46px; height: 46px; border-radius: 18px; display: grid; place-items: center;
    color: var(--dim); transition: transform .3s cubic-bezier(.34,1.4,.64,1); }
  .icobtn:active { transform: scale(.9) rotate(-6deg); }
  .icobtn svg { width: 23px; height: 23px; }
  .icobtn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  .simplebanner { display: none; align-items: center; gap: 10px;
    background: color-mix(in srgb, var(--diaper) 14%, var(--s1));
    border-radius: 18px; padding: 13px 15px; box-shadow: var(--lit); }
  .simplebanner.on { display: flex; }
  .simplebanner .txt { flex: 1; font-size: 15px; font-weight: 600; }
  .simplebanner button { all: unset; cursor: pointer; font-size: 15px; font-weight: 700; color: var(--diaper); padding: 8px; }

  /* ============ hero — the one answer ============ */
  /* glow is reserved for "happening right now": the live hero number while a
     timer runs, the timer banner + Stop, and the ribbon's now-marker. */
  .hero { display: flex; flex-direction: column; gap: 5px; }
  .hero .lead { font-size: 15px; font-weight: 600; color: var(--faint); letter-spacing: .02em; }
  .hero .big { font-size: 46px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .hero .big b { color: var(--gold-text); font-weight: 700; }
  .hero.live .big b { text-shadow: var(--glow); }
  .hero .next { font-size: 16px; color: var(--dim); margin-top: 2px; }
  .hero .next b { color: var(--gold-text); font-weight: 700; }
  .hero .why { font-size: 14px; color: var(--faint); }

  /* ============ baby-hero — a cartoon baby that IS the "current status" zone:
     sleep state near the head, last-feed at the mouth, last-diaper at the legs,
     each with who/how-long. Three rows spread to the baby's head→foot height so
     they read as "coming from" those spots. */
  .babyhero { display: flex; align-items: stretch; gap: 15px; margin: 2px 0 20px; }
  .babyart { flex: 0 0 auto; display: flex; align-items: center; }
  .babyart svg { width: 84px; height: 132px; display: block; }
  .babyrows { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 2px 0; }
  .brow { display: flex; align-items: center; gap: 11px; }
  .brow .bic { flex: none; width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center;
    background: color-mix(in srgb, currentColor 15%, var(--s1)); box-shadow: var(--lit); }
  .brow.head .bic { color: var(--sleep); }
  .brow.mouth .bic { color: var(--feed); }
  .brow.legs .bic { color: var(--diaper); }
  .brow .bic svg { width: 20px; height: 20px; }
  .brow .btxt { min-width: 0; display: flex; flex-direction: column; }
  .brow .bt1 { font-size: 16px; font-weight: 800; color: var(--text); line-height: 1.2; letter-spacing: -.01em; }
  .brow .bt2 { font-size: 12.5px; color: var(--faint); font-weight: 600; margin-top: 1px; }
  body.simple .babyart svg { width: 78px; height: 122px; }

  /* ============ predict — two side-by-side "do this next" tiles ============
     Both predictions get equal, large visual weight now — the manual row
     below is explicitly secondary, deferring to whatever's predicted. */
  .predict-group { display: flex; flex-direction: column; gap: 7px; }
  .predict-label { font-size: 13px; font-weight: 700; letter-spacing: .02em; color: var(--faint); padding-left: 2px; }
  .predict-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .predict-tiles.single { grid-template-columns: 1fr; }
  /* compact: icon on the left, lead + message stacked beside it, so the row is
     ~half the height of the old stacked card. Markup is unchanged — the three
     spans are placed into a 2-col grid. */
  .predict-tile { all: unset; cursor: pointer; box-sizing: border-box;
    display: grid; grid-template-columns: auto 1fr; column-gap: 11px; row-gap: 0;
    align-items: center; padding: 11px 13px; border-radius: 20px; min-height: 0;
    background: linear-gradient(160deg, color-mix(in srgb, var(--gold) 13%, var(--s1)), var(--s1));
    box-shadow: var(--lit), var(--shadow); transition: transform .32s cubic-bezier(.34,1.4,.64,1); }
  .predict-tile.due { background: linear-gradient(160deg, color-mix(in srgb, var(--gold) 22%, var(--s1)), var(--s1)); }
  .predict-tile:active { transform: scale(.96); }
  .predict-tile:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .predict-tile.pop { animation: predictpop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes predictpop { 0% { transform: scale(.9); } 55% { transform: scale(1.035); } 100% { transform: scale(1); } }
  .predict-tile-ic { grid-row: 1 / 3; grid-column: 1; width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center;
    background: color-mix(in srgb, currentColor 18%, var(--s1)); }
  .predict-tile-ic svg { width: 20px; height: 20px; }
  .predict-tile-lead { grid-column: 2; grid-row: 1; font-size: 11.5px; font-weight: 700; color: var(--dim); }
  .predict-tile-msg { grid-column: 2; grid-row: 2; font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.2; text-align: left; }
  body.simple .predict-tile-msg { font-size: 16.5px; }

  /* ============ Last 24 Hours — vertical proportional 24h ruler beside the
     detail list (PiyoLog-style "ruler + log"). The ruler shows the whole day's
     shape: sleep as tall bands, everything else as small dots. It stretches to
     the list's height, so time→pixels stays proportional at any list length. */
  .last24 { display: flex; gap: 12px; align-items: stretch; min-height: 300px; }
  .ruler24 { flex: 0 0 52px; position: relative; }
  /* the rail the bands/dots hang on, in the right-hand track (left 22px = labels) */
  .ruler24::before { content: ""; position: absolute; left: 30px; top: 4px; bottom: 4px; width: 2px;
    border-radius: 2px; background: color-mix(in srgb, var(--faint) 22%, transparent); }
  .r-tick { position: absolute; left: 22px; right: 0; height: 1px; background: color-mix(in srgb, var(--faint) 16%, transparent); }
  .r-lab { position: absolute; left: 0; width: 22px; text-align: right; transform: translateY(-50%);
    font-size: 9.5px; font-weight: 800; letter-spacing: .01em; color: var(--faint); }
  .r-band { position: absolute; left: 24px; width: 14px; border-radius: 7px; background: var(--sleep);
    box-shadow: 0 0 0 2px var(--bg); min-height: 3px; }
  .r-dot { position: absolute; left: 31px; width: 9px; height: 9px; border-radius: 50%;
    transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--bg); }
  #list { flex: 1; min-width: 0; }

  /* Last 24 Hours summary — the rolling-24h totals that head the section
     (counts/totals only; "when did each last happen" lives on the baby-hero). */
  .l24sum { display: flex; flex-wrap: wrap; gap: 10px 18px; margin: 0 0 13px; padding-left: 2px; }
  .l24sum .m { display: flex; align-items: center; gap: 9px; }
  .l24sum .mi { flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center;
    background: color-mix(in srgb, currentColor 16%, var(--s1)); box-shadow: var(--lit); }
  .l24sum .mi svg { width: 16px; height: 16px; }
  .l24sum .mt { display: flex; flex-direction: column; line-height: 1.12; min-width: 0; }
  .l24sum .mv { font-size: 15.5px; font-weight: 800; color: var(--text); letter-spacing: -.01em; }
  .l24sum .mv small { font-size: 12.5px; font-weight: 700; color: var(--dim); }
  .l24sum .ml { font-size: 12px; font-weight: 600; color: var(--faint); }

  /* ============ recent — borderless list ============ */
  .recent h2 { margin: 0 0 8px; font-size: 15px; font-weight: 700; color: var(--dim); }
  /* ---- the day timeline: time · rail+node · text ----
     Deliberately quiet. The ONLY colour is one soft category tint per node
     (feed/sleep/diaper/other); everything else is neutral. No bright
     caregiver badges (attribution shows as faint text, and only when it
     wasn't you), no heavy shadows, no competing text colours. */
  .row { display: flex; align-items: stretch; padding: 11px 0; min-height: 54px; }
  .rowbtn { all: unset; cursor: pointer; display: grid; grid-template-columns: 44px 26px 1fr; column-gap: 12px;
    align-items: stretch; flex: 1; min-width: 0; border-radius: 16px; }
  .rowbtn:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }

  .tl-time { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; line-height: 1.12; }
  .tl-time .hm { font-size: 14.5px; font-weight: 700; color: var(--dim); font-variant-numeric: tabular-nums; }
  .tl-time .ap { font-size: 10px; font-weight: 700; color: var(--faint); letter-spacing: .04em; }

  /* the rail + node. The line runs down the node column, behind the node
     circles (icons = the timeline dots); it extends into the row padding to
     join neighbours into one continuous rail, trimmed at the first/last. */
  .tl-node { position: relative; display: flex; align-items: center; justify-content: center; }
  .tl-node .spine { position: absolute; left: 50%; transform: translateX(-50%); top: -11px; bottom: -11px; width: 2px; z-index: 0;
    background: color-mix(in srgb, var(--faint) 30%, transparent); }
  .tl-node .node { position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    box-shadow: 0 0 0 3px var(--bg); }
  .tl-node .node svg { width: 16px; height: 16px; }
  .tl-node .node.feed   { background: color-mix(in srgb, var(--feed) 15%, var(--bg));   color: var(--feed); }
  .tl-node .node.sleep  { background: color-mix(in srgb, var(--sleep) 15%, var(--bg));  color: var(--sleep); }
  .tl-node .node.diaper { background: color-mix(in srgb, var(--diaper) 15%, var(--bg)); color: var(--diaper); }
  .tl-node .node.other  { background: color-mix(in srgb, var(--gold-text) 13%, var(--bg)); color: var(--gold-text); }
  .timeline-list .row:first-child .tl-node .spine { top: 50%; }
  .timeline-list .row:last-child  .tl-node .spine { bottom: 50%; }
  .timeline-list .row:only-child  .tl-node .spine { display: none; }

  .tl-body { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .tl-body .t1 { font-size: 15.5px; font-weight: 650; color: var(--text); }
  .tl-body .t1 .dim { color: var(--faint); font-weight: 600; }
  .tl-body .t2 { font-size: 13px; color: var(--faint); margin-top: 1px; }
  .empty { text-align: center; color: var(--faint); font-size: 16px; padding: 22px 0 6px; }
  .empty .big { font-size: 30px; margin-bottom: 8px; }
  /* day divider — a clear "———— Yesterday ————" break between calendar days
     inside the rolling 24h timeline. */
  .daydiv { display: flex; align-items: center; gap: 12px; padding: 10px 2px 12px; }
  .daydiv .ln { flex: 1; height: 1px; background: color-mix(in srgb, var(--faint) 26%, transparent); }
  .daydiv .lbl { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }

  /* ============ timer banner — the whole UI while running ============ */
  .timerbar { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(122px + env(safe-area-inset-bottom)); z-index: 40;
    width: min(444px, calc(100vw - 32px)); display: none; align-items: center; gap: 13px;
    background: var(--s2); border-radius: 26px; padding: 14px 13px 14px 19px;
    box-shadow: var(--lit), var(--shadow), var(--glow); }
  .timerbar.on { display: flex; }
  .timerbar .pulse { width: 13px; height: 13px; border-radius: 50%; flex: none; animation: pulse 1.8s ease-in-out infinite; }
  .timerbar .lab { flex: 1; min-width: 0; }
  .timerbar .k { font-size: 14px; color: var(--dim); font-weight: 650; }
  .timerbar .v { font-size: 38px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; text-shadow: var(--glow); }
  .timerbar .side { all: unset; cursor: pointer; font-size: 14.5px; font-weight: 700; color: var(--feed);
    padding: 13px 13px; border-radius: 16px; min-height: 46px; box-sizing: border-box; }
  .timerbar .stop { all: unset; cursor: pointer; font-size: 16.5px; font-weight: 800; color: var(--gold-ink);
    background: var(--gold); padding: 14px 22px; border-radius: 20px; min-height: 50px; box-sizing: border-box;
    box-shadow: 0 0 14px color-mix(in srgb, var(--gold) 45%, transparent);
    transition: transform .3s cubic-bezier(.34,1.4,.64,1); }
  .timerbar .stop:active { transform: scale(.93); }
  .timerbar .side:focus-visible, .timerbar .stop:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .4; transform: scale(.82);} }

  /* ============ action bar — secondary now: predictions carry the primary
     visual weight above. The frequently-used core actions (Nurse/Bottle/
     Sleep/Diaper minus whichever's predicted, plus Solids) get a fixed,
     comfortable size and are always on-screen; Bath and More (the Meds/Temp
     gateway) are rarely tapped, so they sit at the end of the same row and
     are allowed to scroll off-screen rather than shrinking everything to
     force-fit. Fixed widths throughout so buttons never resize as
     predictions change — only their presence toggles. ===== */
  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 10px 0 calc(14px + env(safe-area-inset-bottom)); display: flex; justify-content: center;
    background: linear-gradient(180deg, transparent, var(--bg) 34%); }
  .actions-wrap { position: relative; width: min(480px, 100%); }
  .actions { display: flex; flex-wrap: nowrap; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity; scrollbar-width: none; padding: 0 40px 0 14px; }
  .actions::-webkit-scrollbar { display: none; }
  /* solid, high-contrast badge — not a subtle color fade, which tested as
     nearly invisible (light surface fading into a light page background).
     Reuses the --dim/--panel-ink-edit pairing already verified elsewhere in
     this app for real contrast. Tappable (scrolls the row) and disappears
     once there's nothing left to reveal, via updateScrollHint() in JS. */
  .scrollhint { all: unset; cursor: pointer; position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--dim); color: var(--panel-ink-edit); box-shadow: var(--shadow);
    transition: opacity .2s ease, transform .2s cubic-bezier(.34,1.4,.64,1); }
  .scrollhint svg { width: 16px; height: 16px; }
  .scrollhint:active { transform: translateY(-50%) scale(.88); }
  .scrollhint.hide { opacity: 0; pointer-events: none; }
  .scrollhint:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .act { all: unset; cursor: pointer; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 12px 4px 10px; border-radius: 22px; font-weight: 700; font-size: 12px; min-height: 68px;
    flex: 0 0 70px; scroll-snap-align: start;
    background: var(--s1); box-shadow: var(--lit), var(--shadow);
    transition: transform .3s cubic-bezier(.34,1.4,.64,1); color: var(--text); position: relative; user-select: none; -webkit-user-select: none; }
  .act:active { transform: scale(.9); }
  .act:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .act svg { width: 23px; height: 23px; }
  /* Shortcut row is deliberately quiet — one soft neutral, no rainbow. The
     color pop lives up top on the predicted tiles; the manual fallbacks defer
     to them. --dim is a warm lilac-grey, so this reads calm, not clinical. */
  .act.nurse, .act.bottle, .act.solids, .act.sleep, .act.diaper, .act.bath, .act.more { color: var(--dim); }
  .act .lbl { color: var(--text); white-space: nowrap; }
  .act .sub2 { display: none; } /* dropped: no room in the compact row; the hold-hint + coach-mark still teach the gesture */

      <span class="lbl" id="bathLbl">Bath</span>

    </button>
  </div>
  <button class="scrollhint" id="scrollHint" aria-label="Scroll to see more">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>

<div class="scrim" id="scrim"></div>
