<title>Lull — Baby Tracker (Prototype)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<style>
  /* ============ tokens — "cozy dawn": warmer, rounder, friendlier than the
     original midnight-luxury pass, still calm enough to use at 3am. Every
     text/fill pairing below is WCAG-verified (>=4.5:1 normal text, checked
     against every surface it actually sits on — see commit history for the
     computed ratios), not eyeballed. ============ */
  :root {
    --bg: #f6eef9; --bg-glow: #ffe9d6;
    --s0: #f5eefb; --s1: #fffefb; --s2: #faf3ff;
    --text: #2b1f3d; --dim: #5b4a72; --faint: #6a5a84;
    --gold: #f0713a; --gold-text: #bd4515; --toast-accent: #f0713a; --gold-soft: #ff8f5c; --gold-ink: #2a1200;
    --feed: #ff7a45; --sleep: #8a6ff0; --diaper: #2bc48a; --good: #0c6f49;
    --panel-ink-del: #2a1200; --panel-ink-edit: #fff8f0;
    --glow: 0 0 0 transparent;
    --lit: inset 0 1px 0 rgba(255,255,255,.9);
    --shadow: 0 8px 26px rgba(60,40,80,.10);
    --sheet-shadow: 0 -14px 44px rgba(50,30,70,.18);
    --ring: rgba(189,69,21,.55);
    --scrim: rgba(40,26,55,.45);
    --ts: 1;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #181022; --bg-glow: #2a1c3f;
    --s0: #1f1629; --s1: #221830; --s2: #2b1f3d;
    --text: #f7f0fb; --dim: #d3c3e6; --faint: #a996c2;
    --gold: #ffb37a; --gold-text: #ffb37a; --toast-accent: #bd4515; --gold-soft: #ffc99a; --gold-ink: #2a1200;
    --feed: #ffab7a; --sleep: #b6a3ff; --diaper: #6fe0b8; --good: #58d69e;
    --panel-ink-del: #2a1200; --panel-ink-edit: #2a1200;
    --glow: 0 0 18px rgba(255,179,122,.3);
    --lit: inset 0 1px 0 rgba(255,255,255,.07);
    --shadow: 0 10px 30px rgba(0,0,0,.4);
    --sheet-shadow: 0 -16px 48px rgba(0,0,0,.55);
    --ring: rgba(255,179,122,.5);
    --scrim: rgba(8,4,14,.6);
  } }
  :root[data-theme="light"] {
    --bg: #f6eef9; --bg-glow: #ffe9d6; --s0: #f5eefb; --s1: #fffefb; --s2: #faf3ff;
    --text: #2b1f3d; --dim: #5b4a72; --faint: #6a5a84;
    --gold: #f0713a; --gold-text: #bd4515; --toast-accent: #f0713a; --gold-soft: #ff8f5c; --gold-ink: #2a1200;
    --feed: #ff7a45; --sleep: #8a6ff0; --diaper: #2bc48a; --good: #0c6f49;
    --panel-ink-del: #2a1200; --panel-ink-edit: #fff8f0;
    --glow: 0 0 0 transparent; --lit: inset 0 1px 0 rgba(255,255,255,.9);
    --shadow: 0 8px 26px rgba(60,40,80,.10); --sheet-shadow: 0 -14px 44px rgba(50,30,70,.18);
    --ring: rgba(189,69,21,.55); --scrim: rgba(40,26,55,.45);
  }
  :root[data-theme="dark"] {
    --bg: #181022; --bg-glow: #2a1c3f; --s0: #1f1629; --s1: #221830; --s2: #2b1f3d;
    --text: #f7f0fb; --dim: #d3c3e6; --faint: #a996c2;
    --gold: #ffb37a; --gold-text: #ffb37a; --toast-accent: #bd4515; --gold-soft: #ffc99a; --gold-ink: #2a1200;
    --feed: #ffab7a; --sleep: #b6a3ff; --diaper: #6fe0b8; --good: #58d69e;
    --panel-ink-del: #2a1200; --panel-ink-edit: #2a1200;
    --glow: 0 0 18px rgba(255,179,122,.3); --lit: inset 0 1px 0 rgba(255,255,255,.07);
    --shadow: 0 10px 30px rgba(0,0,0,.4); --sheet-shadow: 0 -16px 48px rgba(0,0,0,.55);
    --ring: rgba(255,179,122,.5); --scrim: rgba(8,4,14,.6);
  }
  /* time-of-day tint (dark ground only, subtle) */
  body[data-tod="dusk"]   { --bg-tint: rgba(138,111,240,.10); }
  body[data-tod="night"]  { --bg-tint: rgba(30,20,60,.0); }
  body[data-tod="predawn"]{ --bg-tint: rgba(255,179,122,.07); }
  body[data-tod="day"]    { --bg-tint: rgba(255,179,122,.05); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { zoom: var(--ts, 1); }
  body {
    background:
      linear-gradient(180deg, var(--bg-tint, transparent), transparent 40%),
      radial-gradient(130% 55% at 50% -10%, var(--bg-glow), transparent 58%),
      var(--bg);
    color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.45; min-height: 100dvh;
  }
  .disp { font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; }
  .tnum { font-variant-numeric: tabular-nums; }
  button { touch-action: manipulation; }

  .app { max-width: 480px; margin: 0 auto; min-height: 100dvh;
    padding: 20px 22px calc(206px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 26px; }

  /* ============ header — quiet ============ */
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .baby-btn { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 2px; border-radius: 14px; min-height: 44px; justify-content: center; }
  .baby-btn .hi { font-size: 15px; color: var(--faint); }
  .baby-btn .nm { font-size: 23px; font-weight: 700; letter-spacing: -.01em; }
  .baby-btn .nm .age { font-size: 14px; font-weight: 600; color: var(--faint); margin-left: 6px; }
  .baby-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
  .hbtns { display: flex; gap: 6px; align-items: center; }
  .whochip { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px 9px 9px; border-radius: 24px; background: var(--s1); box-shadow: var(--lit), var(--shadow);
    font-size: 14.5px; font-weight: 700; min-height: 46px; }
  .whochip:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-size: 13px; font-weight: 800; color: #fff; flex: none; }
  .icobtn { all: unset; cursor: pointer; width: 46px; height: 46px; border-radius: 18px; display: grid; place-items: center;
    color: var(--dim); transition: transform .3s cubic-bezier(.34,1.4,.64,1); }
  .icobtn:active { transform: scale(.9) rotate(-6deg); }
  .icobtn svg { width: 23px; height: 23px; }
  .icobtn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  .simplebanner { display: none; align-items: center; gap: 10px;
    background: color-mix(in srgb, var(--diaper) 14%, var(--s1));
    border-radius: 18px; padding: 13px 15px; box-shadow: var(--lit); }
  .simplebanner.on { display: flex; }
  .simplebanner .txt { flex: 1; font-size: 15px; font-weight: 600; }
  .simplebanner button { all: unset; cursor: pointer; font-size: 15px; font-weight: 700; color: var(--diaper); padding: 8px; }

  /* ============ hero — the one answer ============ */
  /* glow is reserved for "happening right now": the live hero number while a
     timer runs, the timer banner + Stop, and the ribbon's now-marker. */
  .hero { display: flex; flex-direction: column; gap: 5px; }
  .hero .lead { font-size: 15px; font-weight: 600; color: var(--faint); letter-spacing: .02em; }
  .hero .big { font-size: 46px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .hero .big b { color: var(--gold-text); font-weight: 700; }
  .hero.live .big b { text-shadow: var(--glow); }
  .hero .next { font-size: 16px; color: var(--dim); margin-top: 2px; }
  .hero .next b { color: var(--gold-text); font-weight: 700; }
  .hero .why { font-size: 14px; color: var(--faint); }

  /* ============ predict — two side-by-side "do this next" tiles ============
     Both predictions get equal, large visual weight now — the manual row
     below is explicitly secondary, deferring to whatever's predicted. */
  .predict-group { display: flex; flex-direction: column; gap: 10px; }
  .predict-label { font-size: 13px; font-weight: 700; letter-spacing: .02em; color: var(--faint); padding-left: 2px; }
  .predict-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .predict-tiles.single { grid-template-columns: 1fr; }
  .predict-tile { all: unset; cursor: pointer; box-sizing: border-box; display: flex; flex-direction: column;
    align-items: flex-start; gap: 9px; padding: 16px; border-radius: 24px; min-height: 110px;
    background: linear-gradient(160deg, color-mix(in srgb, var(--gold) 16%, var(--s1)), var(--s1));
    box-shadow: var(--lit), var(--shadow); transition: transform .32s cubic-bezier(.34,1.4,.64,1); }
  .predict-tile:active { transform: scale(.96); }
  .predict-tile:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .predict-tile.pop { animation: predictpop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes predictpop { 0% { transform: scale(.9); } 55% { transform: scale(1.035); } 100% { transform: scale(1); } }
  .predict-tile-ic { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center;
    background: color-mix(in srgb, currentColor 18%, var(--s1)); }
  .predict-tile-ic svg { width: 21px; height: 21px; }
  .predict-tile-lead { font-size: 12px; font-weight: 700; color: var(--gold-text); }
  .predict-tile-msg { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.25; text-align: left; }
  body.simple .predict-tile-msg { font-size: 18px; }
  body.simple .predict-tile { min-height: 120px; }

  /* ============ ribbon — signature surface ============ */
  .ribbon { background: var(--s1); border-radius: 26px; padding: 20px 18px 16px; box-shadow: var(--lit), var(--shadow); }
  .ribbon .rhead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 13px; }
  .ribbon .rhead h2 { margin: 0; font-size: 15px; font-weight: 700; color: var(--dim); }
  .ribbon .rhead .meta { font-size: 14px; color: var(--faint); }
  .timeline { position: relative; height: 68px; }
  .tl-track { position: absolute; left: 0; right: 0; top: 16px; height: 32px;
    background: var(--s0); border-radius: 16px; box-shadow: var(--lit); }
  .tl-grid { position: absolute; top: 16px; height: 32px; width: 1px; background: color-mix(in srgb, var(--faint) 22%, transparent); }
  .tl-hour { position: absolute; top: 52px; transform: translateX(-50%); font-size: 13px; color: var(--faint); }
  .tl-now { position: absolute; top: 6px; height: 50px; width: 2px; background: var(--gold-text); border-radius: 2px; z-index: 4; box-shadow: 0 0 10px var(--gold); }
  .tl-moon { position: absolute; top: 0; width: 14px; height: 14px; transform: translateX(-50%); z-index: 5; color: var(--gold-text); filter: drop-shadow(0 0 6px var(--gold)); }
  .tl-bar { position: absolute; top: 20px; height: 24px; border-radius: 7px; z-index: 2; background: var(--sleep); }
  .tl-feed { position: absolute; top: 23px; width: 13px; height: 13px; border-radius: 50%; transform: translateX(-50%); z-index: 3;
    background: var(--feed); box-shadow: 0 0 0 2px var(--s1); }
  .tl-diaper { position: absolute; top: 24px; width: 11px; height: 11px; transform: translateX(-50%) rotate(45deg); z-index: 3;
    background: var(--diaper); border-radius: 3px; box-shadow: 0 0 0 2px var(--s1); }
  .legend { display: flex; gap: 18px; margin-top: 14px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: var(--dim); }
  .legend .lg-feed { width: 11px; height: 11px; border-radius: 50%; background: var(--feed); }
  .legend .lg-sleep { width: 15px; height: 9px; border-radius: 3px; background: var(--sleep); }
  .legend .lg-diaper { width: 10px; height: 10px; border-radius: 2.5px; background: var(--diaper); transform: rotate(45deg); }

  /* quiet stats strip — no cards */
  .strip { display: flex; gap: 12px; justify-content: space-between; }
  .stat { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .stat .k { font-size: 13.5px; font-weight: 600; color: var(--faint); display: flex; align-items: center; gap: 6px; }
  .stat .k i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .stat .v { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
  .stat .v small { font-size: 13px; color: var(--dim); font-weight: 600; }
  .stat .s { font-size: 13px; color: var(--faint); }

  /* ============ recent — borderless list ============ */
  .recent h2 { margin: 0 0 8px; font-size: 15px; font-weight: 700; color: var(--dim);
    display: flex; justify-content: space-between; align-items: baseline; }
  .recent h2 .seeall { all: unset; cursor: pointer; font-size: 15px; font-weight: 700; color: var(--gold-text); padding: 4px; }
  .recent h2 .seeall:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
  .row { display: flex; align-items: center; gap: 13px; padding: 13px 0; min-height: 60px; }
  .rowbtn { all: unset; cursor: pointer; display: flex; align-items: center; gap: 13px; flex: 1; min-width: 0; border-radius: 16px; min-height: 48px; }
  .rowbtn:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
  .glyph { width: 44px; height: 44px; border-radius: 17px; flex: none; display: grid; place-items: center; position: relative;
    background: var(--s1); box-shadow: var(--lit), var(--shadow); }
  .glyph svg { width: 22px; height: 22px; }
  .glyph .who { position: absolute; right: -5px; bottom: -5px; width: 19px; height: 19px; border-radius: 50%;
    display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; box-shadow: 0 0 0 2px var(--bg); }
  .row .t1 { font-size: 17px; font-weight: 650; }
  .row .t2 { font-size: 14.5px; color: var(--faint); }
  .row .when { font-size: 14.5px; color: var(--dim); text-align: right; white-space: nowrap; }
  .row .when .ago { color: var(--faint); }
  .empty { text-align: center; color: var(--faint); font-size: 16px; padding: 22px 0 6px; }
  .empty .big { font-size: 30px; margin-bottom: 8px; }

  /* ============ timer banner — the whole UI while running ============ */
  .timerbar { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(122px + env(safe-area-inset-bottom)); z-index: 40;
    width: min(444px, calc(100vw - 32px)); display: none; align-items: center; gap: 13px;
    background: var(--s2); border-radius: 26px; padding: 14px 13px 14px 19px;
    box-shadow: var(--lit), var(--shadow), var(--glow); }
  .timerbar.on { display: flex; }
  .timerbar .pulse { width: 13px; height: 13px; border-radius: 50%; flex: none; animation: pulse 1.8s ease-in-out infinite; }
  .timerbar .lab { flex: 1; min-width: 0; }
  .timerbar .k { font-size: 14px; color: var(--dim); font-weight: 650; }
  .timerbar .v { font-size: 38px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; text-shadow: var(--glow); }
  .timerbar .side { all: unset; cursor: pointer; font-size: 14.5px; font-weight: 700; color: var(--feed);
    padding: 13px 13px; border-radius: 16px; min-height: 46px; box-sizing: border-box; }
  .timerbar .stop { all: unset; cursor: pointer; font-size: 16.5px; font-weight: 800; color: var(--gold-ink);
    background: var(--gold); padding: 14px 22px; border-radius: 20px; min-height: 50px; box-sizing: border-box;
    box-shadow: 0 0 14px color-mix(in srgb, var(--gold) 45%, transparent);
    transition: transform .3s cubic-bezier(.34,1.4,.64,1); }
  .timerbar .stop:active { transform: scale(.93); }
  .timerbar .side:focus-visible, .timerbar .stop:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .4; transform: scale(.82);} }

  /* ============ action bar — secondary now: predictions carry the primary
     visual weight above. The frequently-used core actions (Nurse/Bottle/
     Sleep/Diaper minus whichever's predicted, plus Solids) get a fixed,
     comfortable size and are always on-screen; Bath and More (the Meds/Temp
     gateway) are rarely tapped, so they sit at the end of the same row and
     are allowed to scroll off-screen rather than shrinking everything to
     force-fit. Fixed widths throughout so buttons never resize as
     predictions change — only their presence toggles. ===== */
  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 10px 0 calc(14px + env(safe-area-inset-bottom)); display: flex; justify-content: center;
    background: linear-gradient(180deg, transparent, var(--bg) 34%); }
  .actions-wrap { position: relative; width: min(480px, 100%); }
  .actions { display: flex; flex-wrap: nowrap; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity; scrollbar-width: none; padding: 0 40px 0 14px; }
  .actions::-webkit-scrollbar { display: none; }
  /* solid, high-contrast badge — not a subtle color fade, which tested as
     nearly invisible (light surface fading into a light page background).
     Reuses the --dim/--panel-ink-edit pairing already verified elsewhere in
     this app for real contrast. Tappable (scrolls the row) and disappears
     once there's nothing left to reveal, via updateScrollHint() in JS. */
  .scrollhint { all: unset; cursor: pointer; position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--dim); color: var(--panel-ink-edit); box-shadow: var(--shadow);
    transition: opacity .2s ease, transform .2s cubic-bezier(.34,1.4,.64,1); }
  .scrollhint svg { width: 16px; height: 16px; }
  .scrollhint:active { transform: translateY(-50%) scale(.88); }
  .scrollhint.hide { opacity: 0; pointer-events: none; }
  .scrollhint:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .act { all: unset; cursor: pointer; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 12px 4px 10px; border-radius: 22px; font-weight: 700; font-size: 12px; min-height: 68px;
    flex: 0 0 70px; scroll-snap-align: start;
    background: var(--s1); box-shadow: var(--lit), var(--shadow);
    transition: transform .3s cubic-bezier(.34,1.4,.64,1); color: var(--text); position: relative; user-select: none; -webkit-user-select: none; }
  .act:active { transform: scale(.9); }
  .act:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .act svg { width: 23px; height: 23px; }
  .act.nurse { color: var(--feed); } .act.bottle { color: var(--feed); } .act.solids { color: var(--feed); }
  .act.sleep { color: var(--sleep); } .act.diaper { color: var(--diaper); }
  .act.bath { color: var(--gold-text); } .act.more { color: var(--dim); }
  .act .lbl { color: var(--text); white-space: nowrap; }
  .act .sub2 { display: none; } /* dropped: no room in the compact row; the hold-hint + coach-mark still teach the gesture */
  .act.armed { background: color-mix(in srgb, var(--sleep) 22%, var(--s1)); box-shadow: var(--lit), var(--shadow), 0 0 14px color-mix(in srgb, var(--sleep) 40%, transparent); }
  /* Simple mode hides the lower-frequency extras (Solids/Bath/More), keeping
     only the core 4 (minus whatever's predicted) — consistent with Simple
     mode's job of showing fewer things, independent of the separate
     "Larger text & controls" sizing lever. */
  body.simple .act.extra { display: none; }

  /* hold-progress hint on long-pressable buttons */
  .act .holdhint { position: absolute; top: 4px; right: 5px; font-size: 7.5px; font-weight: 800; color: var(--faint); letter-spacing: .03em; }
  body.simple .act .holdhint { display: none; }

  /* ============ sheets ============ */
  .scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%); z-index: 51; width: min(480px, 100%);
    background: var(--s1); border-radius: 32px 32px 0 0; box-shadow: var(--sheet-shadow), var(--lit);
    padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); transition: transform .34s cubic-bezier(.32,1.2,.4,1);
    max-height: 88dvh; overflow-y: auto; }
  .sheet.on { transform: translate(-50%, 0); }
  .grip { width: 40px; height: 4px; border-radius: 3px; background: color-mix(in srgb, var(--faint) 40%, transparent); margin: 4px auto 14px; }
  .sheet h3 { margin: 0 0 4px; font-size: 23px; font-weight: 700; letter-spacing: -.01em; }
  .sheet .sub { margin: 0 0 18px; font-size: 15px; color: var(--faint); }
  .sheet h4 { margin: 18px 0 10px; font-size: 13.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--faint); }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-bottom: 16px; }
  .seg.three { grid-template-columns: repeat(3, 1fr); }
  .chip { all: unset; cursor: pointer; box-sizing: border-box; text-align: center; padding: 18px 8px; border-radius: 22px;
    font-size: 17px; font-weight: 700; background: var(--s2); box-shadow: var(--lit); color: var(--text);
    display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 70px;
    transition: transform .3s cubic-bezier(.34,1.4,.64,1); }
  .chip svg { width: 26px; height: 26px; }
  .chip:active { transform: scale(.94); }
  .chip:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .chip[aria-pressed="true"] { box-shadow: var(--lit), inset 0 0 0 1.5px currentColor; background: color-mix(in srgb, currentColor 13%, var(--s1)); }
  .chip.f { color: var(--feed); } .chip.s { color: var(--sleep); } .chip.d { color: var(--diaper); }
  .chip .cl { color: var(--text); font-size: 17px; }
  .chip small { color: var(--faint); font-size: 13.5px; font-weight: 600; }

  .whenrow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }

  function seed() {
    var now = Date.now(), H = 3600000, M = 60000, e = [];
    function a(o){ e.push(o); }
    a({ id:uid(), type:"feed", sub:"nursing", side:"L", by:"sam",   start: now-6.7*H, end: now-6.7*H+16*M });
    a({ id:uid(), type:"diaper", sub:"wet",   by:"sam",   start: now-6.4*H });
    a({ id:uid(), type:"sleep",               by:"you",   start: now-6.1*H, end: now-4.2*H });
    a({ id:uid(), type:"feed", sub:"bottle", amount:120, unit:"ml", by:"grace", start: now-4.0*H });
    a({ id:uid(), type:"diaper", sub:"dirty", by:"grace", start: now-3.6*H });
    a({ id:uid(), type:"sleep",               by:"grace", start: now-3.1*H, end: now-1.7*H });
    a({ id:uid(), type:"feed", sub:"nursing", side:"R", by:"you", start: now-1.5*H, end: now-1.5*H+19*M });
    a({ id:uid(), type:"diaper", sub:"mixed", by:"grace", start: now-1.1*H });
    return e.sort(function (x,y){ return x.start-y.start; });
  }

  /* ---------- predicted next action(s) ----------
     Looks at feed/sleep/diaper independently: the average gap between the
     last few of that type vs. how long it's actually been since the last
     one. Sorted by how far each type is into its typical cycle (highest
     elapsed/average ratio first) — the top 2 that clear ~55% of a typical
     cycle become the primary card and a lighter secondary chip, so the app
     always offers a second guess when the data supports one instead of
     betting everything on a single call. No timer running, since there's
     no "next action" question mid-feed/mid-sleep — the hero already covers
     that. */
  function computePredictions() {
    if (db.timer) return [];
    var now=Date.now();
    var byType = {
      feed:   db.events.filter(function (x){ return x.type==="feed"; }),
      sleep:  db.events.filter(function (x){ return x.type==="sleep"; }),
      diaper: db.events.filter(function (x){ return x.type==="diaper"; })
    };
    var cands=[];
    Object.keys(byType).forEach(function (type) {
      var evs=byType[type];
      if (evs.length<2) return;
      if (type==="feed" && !predictedFeedSub(evs)) return; // no nursing/bottle history to act on yet
      var recent=evs.slice(-6), gaps=[];
      for (var i=1;i<recent.length;i++) gaps.push(recent[i].start-recent[i-1].start);
      var avg=gaps.reduce(function (a,b){return a+b;},0)/gaps.length;
      if (avg<=0) return;
      var last=evs[evs.length-1], elapsed=now-last.start, ratio=elapsed/avg;
      cands.push({ type:type, evs:evs, avg:avg, elapsed:elapsed, ratio:ratio });
    });
    cands.sort(function (a,b){ return b.ratio-a.ratio; });
    return cands.filter(function (c){ return c.ratio>=0.55; }).slice(0,2);
  }
  function predictedFeedSub(evs) {
    var subs=evs.slice(-5).map(function (e){ return e.sub; }).filter(function (s){ return s==="nursing"||s==="bottle"; });
    if (!subs.length) return null;
    var counts={}; subs.forEach(function (s){ counts[s]=(counts[s]||0)+1; });
    if (counts.nursing===counts.bottle) return subs[subs.length-1];
    return counts.nursing>(counts.bottle||0) ? "nursing" : "bottle";
  }
  function buildPredictAction(p) {
    var icon, color, label, actFn, badgeId, cycleWord =
      p.type==="feed" ? "feeds" : p.type==="sleep" ? "sleeps" : "diapers";
    if (p.type==="sleep") {
      icon=ICONS.sleep; color="var(--sleep)"; label=t("sleep"); badgeId="actSleep";
      actFn=function (){ startTimer("sleep"); };
    } else if (p.type==="diaper") {
      icon=ICONS.diaper; color="var(--diaper)"; label=t("diaper")+" · "+t("wet"); badgeId="actDiaper";
      actFn=function (){ logDiaper("wet", Date.now()); };
    } else {
      icon=ICONS.feed; color="var(--feed)";
      var sub=predictedFeedSub(p.evs);
      if (sub==="bottle") {
        var lastBottle=p.evs.filter(function (e){ return e.sub==="bottle"; }).pop();
        var amount=(lastBottle&&lastBottle.amount)||db.pref.lastAmount||(db.pref.unit==="oz"?4:120);
        var unit=(lastBottle&&lastBottle.unit)||db.pref.unit||"ml";
        label=t("bottle")+" · "+amount+" "+unit; badgeId="actBottle";
        actFn=function (){ logBottle(amount, unit, Date.now()); };
      } else {
        var side=nextSide();
        label=t("nursing")+" · "+(side==="R"?t("right"):t("left")); badgeId="actNurse";
        actFn=function (){ startTimer("feed", side); };
      }
    }
    return { icon:icon, color:color, label:label, actFn:actFn, badgeId:badgeId, cycleWord:cycleWord };
  }

  /* Renders the (up to 2) predicted tiles AND, in the same pass, hides
     whichever of the 4 core manual buttons are now covered by a tile —
     the row defers to the prediction instead of duplicating it. Solids/
     Bath/More are never touched here; they have no predictable cycle, so
     they stay as always-available constants in the row. */
  var lastPredictMsgs=[null,null];
  function renderPredict() {
    var group=$("#predictGroup"), tiles=$("#predictTiles"), t0=$("#predictTile0"), t1=$("#predictTile1");
    ["actNurse","actBottle","actSleep","actDiaper"].forEach(function (id){ $("#"+id).hidden=false; });
    var list=computePredictions();
    if (!list.length) {
      group.hidden=true;
      t0.hidden=true; t0.onclick=null; t1.hidden=true; t1.onclick=null;
      lastPredictMsgs=[null,null];
      return;
    }
    group.hidden=false;
    tiles.classList.toggle("single", list.length<2);
    [t0, t1].forEach(function (tile, i) {
      var p=list[i];
      if (!p) { tile.hidden=true; tile.onclick=null; lastPredictMsgs[i]=null; return; }
      var a=buildPredictAction(p);
      tile.querySelector(".predict-tile-ic").innerHTML=a.icon;
      tile.querySelector(".predict-tile-ic").style.color=a.color;
      tile.querySelector(".predict-tile-lead").textContent = p.ratio>=1 ? "Ready" : "Soon";
      tile.querySelector(".predict-tile-msg").textContent = a.label;
      tile.setAttribute("aria-label", "Log "+a.label+" now — predicted next action");
      if (tile.hidden || lastPredictMsgs[i]!==a.label) { tile.classList.remove("pop"); void tile.offsetWidth; tile.classList.add("pop"); }
      tile.hidden=false;
      tile.onclick=function (){ buzz(16); a.actFn(); };
      if (a.badgeId) $("#"+a.badgeId).hidden=true; // this action moved up into a tile — don't show it twice
      lastPredictMsgs[i]=a.label;
    });
  }

  function renderTimeline() {
    var tl=$("#timeline"); tl.innerHTML=""; var s=startOfDay(), DAY=86400000;
    var tr=document.createElement("div"); tr.className="tl-track"; tl.appendChild(tr);
    [6,12,18].forEach(function (h){ var g=mk("tl-grid"); g.style.left=(h/24*100)+"%"; tl.appendChild(g); });
    [0,6,12,18,24].forEach(function (h){ var lab=mk("tl-hour"); lab.style.left=Math.min(97,Math.max(3,h/24*100))+"%";

  function renderStrip() {
    var t2=todays(), out="";
    (db.pref.stats||[]).slice(0,3).forEach(function (key){
      if (key==="sleep") { var ms=t2.filter(function (x){return x.type==="sleep"&&x.end;}).reduce(function (a,x){return a+(x.end-x.start);},0);
        out+=stat("sleep", t("sleep_today"), ms?durShort(ms):"0m", ""); }
      if (key==="diapers") { var ds=t2.filter(function (x){return x.type==="diaper";}); var w=ds.filter(function (x){return x.sub!=="dirty";}).length, dd=ds.filter(function (x){return x.sub!=="wet";}).length;
        out+=stat("diaper", t("diapers"), String(ds.length), w+" "+t("wet").toLowerCase()+" · "+dd+" "+t("dirty").toLowerCase()); }
      if (key==="feedVol") { var bs=t2.filter(function (x){return x.type==="feed"&&x.sub==="bottle";});
        var unit=bs.length?(bs[bs.length-1].unit||"ml"):(db.pref.unit||"ml");
        var total=bs.filter(function (x){return (x.unit||"ml")===unit;}).reduce(function (a,x){return a+(+x.amount||0);},0);
        out+=stat("feed", t("fed_today"), (unit==="oz"?String(+total.toFixed(1)):String(total))+" "+unit, bs.length+" ×"); }
      if (key==="lastDiaper") { var ld=null, arr=db.events.filter(function (x){return x.type==="diaper";}); if (arr.length) ld=arr[arr.length-1];
        out+=stat("diaper", t("last_diaper"), ld?agoStr(ld.start):"—", ld?detailFor(ld):""); }

  /* Swipe-right auto-triggers Edit on release (safe, non-destructive — no
     harm in firing straight from the gesture). Swipe-left only REVEALS
     Delete; it does not fire on release — a destructive action needs its
     own distinct confirming tap on the now-visible Delete button, so a
     slightly-too-long drag-and-release can never silently delete a log
     entry. Tap always still opens the edit sheet as the unconditional
     baseline — swipe is an accelerator, never the only path, so mouse/
     keyboard/screen-reader users lose nothing. Only one row can be
     revealed at a time. */
  function wireSwipe(row, btn, onEdit, onDelete) {
    var startX=0, startY=0, dx=0, active=false, locked=null, suppressClick=false;
    var THRESH=64, REVEAL=96;
    var under=row.querySelector(".swipeunder"), delBtn=row.querySelector(".sw-del");

    function closeReveal() {
      row.classList.remove("revealed"); btn.style.transform="";
      under.setAttribute("aria-hidden","true"); delBtn.setAttribute("tabindex","-1"); delBtn.setAttribute("aria-hidden","true");
      if (revealedRow===closeReveal) revealedRow=null;
    }
    function openReveal() {
      if (revealedRow && revealedRow!==closeReveal) revealedRow();
      row.classList.add("revealed"); btn.style.transform="translateX(-"+REVEAL+"px)";
      under.setAttribute("aria-hidden","false"); delBtn.setAttribute("tabindex","0"); delBtn.setAttribute("aria-hidden","false");
      revealedRow=closeReveal;
    }
    delBtn.addEventListener("click", function (e){ e.stopPropagation(); closeReveal(); onDelete(); });

    btn.addEventListener("pointerdown", function (e){
      if (revealedRow && revealedRow!==closeReveal) revealedRow();
      startX=e.clientX; startY=e.clientY; dx = row.classList.contains("revealed") ? -REVEAL : 0; active=true; locked=null;
    });
    btn.addEventListener("pointermove", function (e){
      if (!active) return;
      var mx=e.clientX-startX, my=e.clientY-startY;
      if (locked===null) { if (Math.abs(mx)<6 && Math.abs(my)<6) return; locked = Math.abs(mx)>Math.abs(my) ? "x" : "y"; }
      if (locked!=="x") return;
      var base = row.classList.contains("revealed") ? -REVEAL : 0;
      dx = Math.max(-REVEAL, Math.min(96, base+mx));
      row.classList.add("swiping"); btn.style.transform="translateX("+dx+"px)";
    });
    function end() {
      if (!active) return; active=false; row.classList.remove("swiping");
      if (locked==="x") {
        suppressClick=true;
        if (dx<=-THRESH) { buzz(20); openReveal(); }
        else if (dx>=THRESH) { buzz(20); closeReveal(); onEdit(); }
        else { closeReveal(); }
      }
    }
    btn.addEventListener("pointerup", end);
    btn.addEventListener("pointercancel", function (){ active=false; row.classList.remove("swiping"); });
    btn.addEventListener("pointerleave", function (){ if (active && locked!=="x") { active=false; row.classList.remove("swiping"); } });
    btn.addEventListener("click", function (e){
      if (suppressClick) { suppressClick=false; e.preventDefault(); return; }
      if (row.classList.contains("revealed")) { closeReveal(); return; }
      onEdit();
    });
  }

  function whenControl() {
    return '<h4>'+t("when")+'</h4><div class="whenrow" id="whenRow">'+
      '<button data-off="0" aria-pressed="true">'+t("now")+'</button>'+
      '<button data-off="15">15m</button><button data-off="30">30m</button><button data-off="60">1h</button>'+
      '<input type="time" id="whenTime" aria-label="Custom time" /></div>';
  }
  function wireWhen(root) {
    var offset={v:0}, custom=null;
    root.querySelectorAll("#whenRow [data-off]").forEach(function (b){ b.addEventListener("click", function (){
      root.querySelectorAll("#whenRow [data-off]").forEach(function (x){ x.setAttribute("aria-pressed", x===b?"true":"false"); });
      offset.v=+b.dataset.off; custom=null; var ti=root.querySelector("#whenTime"); if (ti) ti.value="";
    }); });
    var ti=root.querySelector("#whenTime");
    if (ti) ti.addEventListener("change", function (){ if (!ti.value){ custom=null; return; }
      root.querySelectorAll("#whenRow [data-off]").forEach(function (x){ x.setAttribute("aria-pressed","false"); });
      var p=ti.value.split(":"), d=new Date(); d.setHours(+p[0],+p[1],0,0); if (d.getTime()>Date.now()) d.setDate(d.getDate()-1); custom=d.getTime(); });
    return function (){ return custom!=null ? custom : Date.now()-offset.v*60000; };
  }

  /* ---------- long-press helper ---------- */
  function pressable(el, onTap, onHold) {
    var timer=null, held=false;
    function down(e) { held=false; timer=setTimeout(function (){ held=true; buzz(28); onHold(); }, 480); }
    function up(e) { clearTimeout(timer); if (!held && e.type!=="pointerleave" && e.type!=="pointercancel") onTap(); }
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointerleave", function (){ clearTimeout(timer); });
    el.addEventListener("pointercancel", function (){ clearTimeout(timer); });
    el.addEventListener("contextmenu", function (e){ e.preventDefault(); });
    el.addEventListener("keydown", function (e){ if (e.key==="Enter"||e.key===" "){ e.preventDefault(); onTap(); } if (e.key==="h"||e.key==="H") onHold(); });
  }

    $("#tilePick").querySelectorAll("[data-tile]").forEach(function (b){ b.addEventListener("click", function (){
      var k=b.dataset.tile, arr=(db.pref.stats||[]).slice(), i=arr.indexOf(k);
      if (i>=0) arr.splice(i,1); else { arr.push(k); if (arr.length>3) arr.shift(); }
      db.pref.stats=arr; persist();
      $("#tilePick").querySelectorAll("[data-tile]").forEach(function (x){ x.setAttribute("aria-pressed", db.pref.stats.indexOf(x.dataset.tile)>=0?"true":"false"); });
      render(); }); });
    $("#goSolids").addEventListener("click", function (){ solidsSheet(); });
    $("#swSimple").addEventListener("click", function (){ me.simple=!me.simple; persist(); this.setAttribute("aria-pressed", me.simple); render(); });
    $("#swAccess").addEventListener("click", function (){ me.access=!me.access; persist(); this.setAttribute("aria-pressed", me.access); render(); });
    $("#langEn").addEventListener("click", function (){ me.lang="en"; persist(); render(); settingsSheet(); });
    $("#langTl").addEventListener("click", function (){ me.lang="tl"; persist(); render(); settingsSheet(); });
    $("#sheet").querySelectorAll("[data-soon]").forEach(function (b){ b.addEventListener("click", function (){ toast('"'+b.dataset.soon+'" is on the roadmap ✨'); }); });
  }

  function babySheet() {
    var dobVal=db.baby.dob?new Date(db.baby.dob).toISOString().slice(0,10):"";
    openSheet('<h3 id="sheetTitle">Baby profile</h3><p class="sub">Used for greetings and (soon) growth charts.</p>'+
      '<input class="field" id="nm" value="'+(db.baby.name||"")+'" placeholder="Baby\'s name" autocomplete="off" />'+
      '<label class="lbl">Date of birth</label><input class="field" id="dob" type="date" value="'+dobVal+'" />'+
      '<div class="stickycta ctarow"><button class="cta ghost" id="cxl">Cancel</button><button class="cta" id="sv">Save</button></div>');
    $("#cxl").addEventListener("click", closeSheet);
    $("#sv").addEventListener("click", function (){ db.baby.name=$("#nm").value.trim()||"Baby"; var dob=$("#dob").value;
      db.baby.dob=dob?new Date(dob+"T12:00:00").getTime():null; persist(); render(); closeSheet(); toast("Profile saved", null, null, true); });
  }

  /* ---------- wire actions ---------- */
  pressable($("#actNurse"),
    function (){ // tap: start on alternation-implied side; if nursing timer running, stop it
      if (db.timer && db.timer.type==="feed") { stopTimer(); return; }
      if (db.timer) { toast("Stop the sleep timer first"); return; }
      var s=nextSide(); db.pref.side=s; startTimer("feed", s); },
    function (){ // hold: other side
      if (db.timer) { toast("Stop the current timer first"); return; }
      var s=nextSide()==="L"?"R":"L"; db.pref.side=s; startTimer("feed", s); });
  pressable($("#actDiaper"),
    function (){ logDiaper("wet", Date.now()); },
    function (){ diaperPicker(); });
  $("#actBottle").addEventListener("click", bottleSheet);
  $("#actSleep").addEventListener("click", function (){
    if (db.timer&&db.timer.type==="sleep") stopTimer();
    else if (db.timer) toast("Stop the nursing timer first");
    else startTimer("sleep"); });
  $("#actSolids").addEventListener("click", solidsSheet);
  $("#actBath").addEventListener("click", function (){ buzz(); logBath(Date.now()); });
  $("#actMoreRow").addEventListener("click", moreShortcutsSheet);

  /* Shows a solid, tappable chevron badge whenever there's more of the
     action row to scroll to (Bath/More living off-screen), and hides it
     once fully scrolled — not a color fade, which tested as too subtle to
     notice against the light theme's surfaces. */
  var actionsRow=$("#actionsRow"), scrollHint=$("#scrollHint");
  function updateScrollHint() {
    var remaining = actionsRow.scrollWidth - actionsRow.clientWidth - actionsRow.scrollLeft;
    scrollHint.classList.toggle("hide", remaining < 16);
  }
  actionsRow.addEventListener("scroll", updateScrollHint);
  scrollHint.addEventListener("click", function (){ actionsRow.scrollBy({ left: 180, behavior: "smooth" }); });
  window.addEventListener("resize", updateScrollHint);
  $("#babyBtn").addEventListener("click", babySheet);
  $("#whoChip").addEventListener("click", shareSheet);
  $("#setBtn").addEventListener("click", settingsSheet);
  $("#sbBack").addEventListener("click", function (){
    if (db.cur==="you") { cur().simple=false; cur().access=false; } else { db.cur="you"; }
    persist(); render(); });
  $("#seeAll").addEventListener("click", function (){ showAll=!showAll; renderList(); });
  $("#resetBtn").addEventListener("click", function (){ if (!confirm("Reset the demo? This clears all data on this device.")) return;
    Object.keys(K).forEach(function (k){ localStorage.removeItem(K[k]); });
    db.care=DEFAULT_CARE.map(function (c){ return Object.assign({}, c); }); db.cur="you";
    db.pref={ unit:"ml", side:"L", lastAmount:null, stats:["sleep","diapers","feedVol"] };
    db.baby={ name:"Baby", dob: Date.now()-86400000*84 }; db.timer=null; db.events=seed(); persist(); render(); toast("Demo reset", null, null, true); });

  render();
  maybeShowGestureTip();
  setInterval(tickTimer, 1000);
  setInterval(render, 60000);
})();
</script>
