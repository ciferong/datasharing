<div class="toast" id="toast"><span class="chk" id="toastChk" hidden>✓</span><span id="toastMsg"></span><button id="toastAction" hidden></button></div>

<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var K = { ev:"lull.events.v5", baby:"lull.baby.v5", timer:"lull.timer.v5", pref:"lull.pref.v5", care:"lull.care.v5", cur:"lull.cur.v5" };

  var I18N = {
    en: { g_morning:"Good morning", g_afternoon:"Good afternoon", g_evening:"Good evening", g_night:"Late night",
      nurse:"Nurse", bottle:"Bottle", sleep:"Sleep", diaper:"Diaper", wake:"Wake",
      left:"Left", right:"Right", wet:"Wet", dirty:"Dirty", mixed:"Mixed", solids:"Solids", nursing:"Nursing",
      last_fed:"Last fed", ago:"ago",
      todays_rhythm:"Last 24 Hours", recent:"Recent", now:"Now", asleep:"Asleep", awake:"Awake",
      sleep_today:"Sleep today", diapers:"Diapers", fed_today:"Fed today", last_diaper:"Last diaper", right_now:"Right now",
      saved:"logged", when:"When", today:"today", tap_start:"tap = start", tap_wet:"tap = wet",
      simple_mode:"Simple mode", switch_back:"Switch back", logging_as:"logging as",
      nothing:"All quiet for now", tapbelow:"Tap a button below when you're ready",
      log_bottle:"Log bottle", log_solids:"Log solids", choose_diaper:"Log a diaper", onetap:"One tap.",
      never_paywalled:"Free forever — sharing is never behind a paywall.",
      bath:"Bath", meds:"Meds", temp:"Temp", more:"More", predicted_for_you:"Predicted for you",
      log_meds:"Log meds", log_temp:"Log temperature", meds_name_ph:"What medicine? (e.g. Tylenol)",
      meds_dose_ph:"Dose (e.g. 2.5ml)", more_sub:"Less-frequent logs.", coming_soon:"Coming soon",
      day_today:"Today", day_yesterday:"Yesterday",
      hero_fed:"Fed", hero_changed:"Changed", by:"by", no_feed:"Not fed yet", no_change:"No changes yet",
      last_nap:"last nap", feeds:"feeds" },
    tl: { g_morning:"Magandang umaga", g_afternoon:"Magandang hapon", g_evening:"Magandang gabi", g_night:"Gabing-gabi na",
      nurse:"Pasuso", bottle:"Bote", sleep:"Tulog", diaper:"Lampin", wake:"Gising",
      left:"Kaliwa", right:"Kanan", wet:"Basa", dirty:"Dumi", mixed:"Basa at dumi", solids:"Pagkain", nursing:"Pasuso",
      last_fed:"Huling pakain", ago:"ang nakalipas",
      todays_rhythm:"Huling 24 Oras", recent:"Mga huling ginawa", now:"Ngayon", asleep:"Tulog", awake:"Gising",
      sleep_today:"Tulog ngayon", diapers:"Lampin", fed_today:"Nainom ngayon", last_diaper:"Huling lampin", right_now:"Ngayon mismo",
      saved:"na-log", when:"Kailan", today:"ngayon", tap_start:"pindot = simula", tap_wet:"pindot = basa",
      simple_mode:"Simpleng mode", switch_back:"Bumalik", logging_as:"nagre-record bilang",
      nothing:"Tahimik muna", tapbelow:"Pindutin ang buton sa ibaba kapag handa na",
      log_bottle:"I-record ang bote", log_solids:"I-record ang pagkain", choose_diaper:"Mag-record ng lampin", onetap:"Isang pindot lang.",
      never_paywalled:"Libre magpakailanman — hindi kailanman babayaran ang pagbabahagi.",
      bath:"Ligo", meds:"Gamot", temp:"Lagnat", more:"Iba pa", predicted_for_you:"Hula para sa iyo",
      log_meds:"I-record ang gamot", log_temp:"I-record ang temperatura", meds_name_ph:"Anong gamot? (hal. Tylenol)",
      meds_dose_ph:"Dosis (hal. 2.5ml)", more_sub:"Bihirang i-record.", coming_soon:"Paparating na",
      day_today:"Ngayong araw", day_yesterday:"Kahapon",
      hero_fed:"Pinakain", hero_changed:"Pinalitan", by:"ni", no_feed:"Wala pang pakain", no_change:"Wala pang palit",
      last_nap:"huling idlip", feeds:"pakain" }
  };

  /* `simple` (fewer things on screen) and `access` (larger text & controls) are
     independent — neither is inferred from caregiver identity. Grace defaults to
     Simple because she asked for less clutter, not because bigger controls are
     assumed from being "the helper"; either caregiver can turn `access` on. */
  /* avatar fill colors are fixed (not theme-reactive) and paired with white
     initials, so each is picked to clear 4.5:1 against white on its own —
     these are deliberately a shade darker than the matching category hue. */
  var DEFAULT_CARE = [
    { id:"you",   name:"You",   badge:"Y", color:"#8a5c14", role:"Owner",   simple:false, access:false, lang:"en" },
    { id:"grace", name:"Grace", badge:"G", color:"#0b7259", role:"Helper",  simple:true,  access:false, lang:"tl" },
    { id:"sam",   name:"Sam",   badge:"S", color:"#5a49c8", role:"Partner", simple:false, access:false, lang:"en" }
  ];

  var db = {
    events: load(K.ev, null), baby: load(K.baby, null), timer: load(K.timer, null),
    pref: load(K.pref, { unit:"ml", side:"L", lastAmount:null, stats:["sleep","diapers","feedVol"] }),
    care: load(K.care, null), cur: load(K.cur, "you")
  };
  var lastDeleted = null, toastTimer = null, revealedRow = null;

  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function saveK(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function persist() { saveK(K.ev, db.events); saveK(K.baby, db.baby); saveK(K.timer, db.timer); saveK(K.pref, db.pref); saveK(K.care, db.care); saveK(K.cur, db.cur); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p || 18); } catch (e) {} }

  if (!db.care) db.care = DEFAULT_CARE.map(function (c) { return Object.assign({}, c); });
  db.care.forEach(function (c) { if (c.access == null) c.access = false; });
  if (!db.pref.stats) db.pref.stats = ["sleep","diapers","feedVol"];
  if (db.events === null) { db.baby = { name:"Baby", dob: Date.now() - 86400000 * 84 }; db.events = seed(); persist(); }
  if (!db.baby) db.baby = { name:"Baby", dob:null };

  function seed() {
    var now = Date.now(), H = 3600000, M = 60000, e = [];
    function a(o){ e.push(o); }
    // —— the previous evening + overnight, so the rolling 24h window spans two
    // calendar days and the day divider is visible in the demo ——
    a({ id:uid(), type:"feed", sub:"bottle", amount:100, unit:"ml", by:"sam",  start: now-21.5*H });
    a({ id:uid(), type:"diaper", sub:"dirty",              by:"sam",  start: now-20.9*H });
    a({ id:uid(), type:"sleep",                            by:"you",  start: now-19.6*H, end: now-18.3*H });
    a({ id:uid(), type:"feed", sub:"nursing", side:"R",    by:"you",  start: now-13.7*H, end: now-13.7*H+17*M });
    a({ id:uid(), type:"sleep",                            by:"you",  start: now-12.9*H, end: now-8.4*H });
    a({ id:uid(), type:"feed", sub:"nursing", side:"L",    by:"grace",start: now-8.1*H,  end: now-8.1*H+15*M });
    // —— the current day ——
    a({ id:uid(), type:"feed", sub:"nursing", side:"L", by:"sam",   start: now-6.7*H, end: now-6.7*H+16*M });
    a({ id:uid(), type:"diaper", sub:"wet",   by:"sam",   start: now-6.4*H });
    a({ id:uid(), type:"sleep",               by:"you",   start: now-6.1*H, end: now-4.2*H });
    a({ id:uid(), type:"feed", sub:"bottle", amount:120, unit:"ml", by:"grace", start: now-4.0*H });
    a({ id:uid(), type:"diaper", sub:"dirty", by:"grace", start: now-3.6*H });
    a({ id:uid(), type:"sleep",               by:"grace", start: now-3.1*H, end: now-1.7*H });
    a({ id:uid(), type:"feed", sub:"nursing", side:"R", by:"you", start: now-1.5*H, end: now-1.5*H+19*M });
    a({ id:uid(), type:"diaper", sub:"mixed", by:"grace", start: now-1.1*H });
    return e.sort(function (x,y){ return x.start-y.start; });
  }

  function cur() { return db.care.filter(function (c){ return c.id===db.cur; })[0] || db.care[0]; }
  function careById(id) { return db.care.filter(function (c){ return c.id===id; })[0] || db.care[0]; }
  function lang() { return cur().lang || "en"; }
  function simpleOn() { return !!cur().simple; }
  function accessOn() { return !!cur().access; }
  function t(key) { var L=I18N[lang()]||I18N.en; return L[key]!=null?L[key]:(I18N.en[key]!=null?I18N.en[key]:key); }

  function fmtClock(ts) { return new Date(ts).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }); }
  function fmtClockParts(ts) { var d=new Date(ts), h=d.getHours(), ap=h<12?"AM":"PM", h12=h%12||12, m=String(d.getMinutes()).padStart(2,"0"); return { hm:h12+":"+m, ap:ap }; }
  function catClass(type) { return type==="feed"?"feed":type==="sleep"?"sleep":type==="diaper"?"diaper":"other"; }
  // calendar-day identity + a friendly label ("Today"/"Yesterday"/"Wed, Jul 23")
  // for the day dividers in the 24h timeline.
  function dayKey(ts) { var d=new Date(ts); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
  function dayLabel(ts) {
    var d=new Date(ts), today=new Date(), yest=new Date(); yest.setDate(yest.getDate()-1);
    if (dayKey(ts)===dayKey(today.getTime())) return t("day_today");
    if (dayKey(ts)===dayKey(yest.getTime())) return t("day_yesterday");
    return d.toLocaleDateString([], { weekday:"short", month:"short", day:"numeric" });
  }
  function agoStr(ts) { var s=Math.max(0,Math.floor((Date.now()-ts)/1000));
    if (s<60) return "now"; var m=Math.floor(s/60); if (m<60) return m+"m";
    var h=Math.floor(m/60), r=m%60; return r?h+"h "+r+"m":h+"h"; }
  function dur(ms) { var s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
    return h>0 ? h+":"+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0") : m+":"+String(ss).padStart(2,"0"); }
  function durShort(ms) { var m=Math.round(ms/60000); if (m<60) return m+"m"; var h=Math.floor(m/60), r=m%60; return r?h+"h "+r+"m":h+"h"; }
  function startOfDay() { var d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
  function todays() { var s=startOfDay(); return db.events.filter(function (x){ return x.start>=s; }); }
  function ageText() { if (!db.baby.dob) return ""; var d=Math.floor((Date.now()-db.baby.dob)/86400000);
    return d<14?d+"d":d<90?Math.floor(d/7)+"w":Math.floor(d/30.4)+"mo"; }

  var ICONS = {
    feed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8M9 2l.6 3M15 2l-.6 3"/><path d="M7.5 8.5c0-1.7 1.2-3 2.7-3.4h3.6c1.5.4 2.7 1.7 2.7 3.4V19a3 3 0 0 1-3 3H10.5a3 3 0 0 1-3-3z"/><path d="M8 12h4"/></svg>',
    sleep:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    diaper:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v3a9 9 0 0 1-9 9 9 9 0 0 1-9-9z"/><path d="M3 6c4 1.5 14 1.5 18 0"/></svg>',
    solids:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a8 8 0 0 0 16 0"/><path d="M4 11h16"/><path d="M17 11V4c-1.6 0-2.5 1.6-2.5 3.5S15.4 11 17 11z"/></svg>',
    bath:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M7 12V6a2 2 0 0 1 4 0"/></svg>',
    meds:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="8" rx="4"/><line x1="12" y1="8" x2="12" y2="16"/></svg>',
    temp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/><path d="M12 8v5"/></svg>',
    nurse:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10c0-2.2 2-4 5-4h6c3 0 5 1.8 5 4 0 4.2-4 7.5-8 7.5S4 14.2 4 10z"/><circle cx="12" cy="10.5" r="1.7"/></svg>'
  };
  function colorFor(x) {
    if (x==="feed") return "var(--feed)";
    if (x==="sleep") return "var(--sleep)";
    if (x==="diaper") return "var(--diaper)";
    return "var(--gold-text)"; // bath/meds/temp — secondary/extra types share the accent hue
  }

  function labelFor(ev) {
    if (ev.type==="feed") return ev.sub==="nursing"?t("nursing"):ev.sub==="bottle"?t("bottle"):ev.sub==="solids"?t("solids"):"Feed";
    if (ev.type==="sleep") return t("sleep");
    if (ev.type==="diaper") return t("diaper");
    if (ev.type==="bath") return t("bath");
    if (ev.type==="meds") return t("meds");
    if (ev.type==="temp") return t("temp");
    return "Event";
  }
  function detailFor(ev) {
    if (ev.type==="feed") {
      if (ev.sub==="nursing") return (ev.side==="R"?t("right"):t("left"))+(ev.end?" · "+durShort(ev.end-ev.start):"");
      if (ev.sub==="bottle") return ev.amount+" "+(ev.unit||"ml");
      if (ev.sub==="solids") return ev.note||t("solids");
    }
    if (ev.type==="sleep") return ev.end?durShort(ev.end-ev.start):"…";
    if (ev.type==="diaper") return ev.sub==="wet"?t("wet"):ev.sub==="dirty"?t("dirty"):t("mixed");
    if (ev.type==="temp") return ev.value.toFixed(1)+"°"+ev.unit;
    if (ev.type==="meds") return ev.name+(ev.dose?" · "+ev.dose:"");
    return "";
  }
  function nextSide() {
    var n=db.events.filter(function (x){ return x.type==="feed"&&x.sub==="nursing"&&x.side; });
    if (!n.length) return db.pref.side||"L";
    return n[n.length-1].side==="L"?"R":"L";
  }

  /* ---------- time of day ---------- */
  function tod() { var h=new Date().getHours();
    return h>=17&&h<21?"dusk":h>=21||h<5?"night":h<8?"predawn":"day"; }

  /* Theme: 'auto' follows the OS (no data-theme attr → the @media block wins);
     'light'/'dark' pin it explicitly. Cycled by the header toggle, remembered
     per install in db.pref.theme. */
  var THEME_ICONS = {
    auto:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M19.4 4.6 17.8 6.2M6.2 17.8 4.6 19.4"/></svg>',
    dark:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
  };
  function applyTheme() {
    var th = db.pref.theme || "auto";
    if (th === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", th);
    var btn = $("#themeBtn");
    if (btn) {
      btn.innerHTML = THEME_ICONS[th];
      btn.setAttribute("aria-label", "Theme: "+th+" — tap to change");
      btn.setAttribute("title", "Theme: "+th);
    }
  }

  /* ---------- RENDER ---------- */
  function render() {
    document.body.dataset.tod = tod();
    applyTheme();
    document.body.classList.toggle("simple", simpleOn());
    document.body.classList.toggle("access", accessOn());
    document.documentElement.style.setProperty("--ts", accessOn() ? "1.18" : "1");
    var hh=new Date().getHours();
    $("#greet").textContent = hh<5?t("g_night"):hh<12?t("g_morning"):hh<17?t("g_afternoon"):hh<22?t("g_evening"):t("g_night");
    $("#babyName").textContent = db.baby.name||"Baby";
    $("#babyAge").textContent = ageText()?"· "+ageText():"";
    $("#raTitle").textContent = t("todays_rhythm"); // "Today" — the recent list IS the day timeline now
    $("#nurseLbl").textContent=t("nurse"); $("#bottleLbl").textContent=t("bottle");
    $("#diaperLbl").textContent=t("diaper");
    $("#solidsLbl").textContent=t("solids"); $("#bathLbl").textContent=t("bath"); $("#moreLbl").textContent=t("more");
    $("#predictLabel").textContent=t("predicted_for_you");
    $("#nurseSub").textContent="tap = "+(nextSide()==="R"?t("right"):t("left"));
    $("#bottleSub").textContent = db.pref.lastAmount? "tap = "+db.pref.lastAmount+" "+db.pref.unit : "";
    $("#sleepSub").textContent = db.timer&&db.timer.type==="sleep" ? "" : t("tap_start");
    $("#diaperSub").textContent = t("tap_wet");
    renderWho(); renderHero(); renderPredict(); renderSummary(); renderRuler(); renderList(); renderTimer();
    updateScrollHint(); // button visibility above can change how much is left to scroll to
  }

  function renderWho() {
    var c=cur(); $("#whoAv").style.background=c.color; $("#whoAv").textContent=c.badge; $("#whoNm").textContent=c.name;
    var sb=$("#simpleBanner");
    if (simpleOn() || accessOn()) {
      var label = simpleOn() && accessOn() ? t("simple_mode")+" + larger text"
        : simpleOn() ? t("simple_mode") : "Larger text";
      sb.classList.add("on"); $("#sbAv").style.background=c.color; $("#sbAv").textContent=c.badge;
      $("#sbTxt").textContent=label+" — "+t("logging_as")+" "+c.name; $("#sbBack").textContent=t("switch_back");
    } else sb.classList.remove("on");
  }

  // The baby-hero: last feed at the mouth, last diaper at the legs, each with
  // who did it. The icon on the fed row reflects how baby was fed last —
  // breast / bottle / solids. (A running feed/sleep still shows in the fixed
  // timer banner, so the hero always answers "when did each last happen".)
  function fedIcon(sub) { return sub==="bottle" ? ICONS.feed : sub==="solids" ? ICONS.solids : ICONS.nurse; }
  function latestOf(type) {
    return db.events.reduce(function (best, x){ return x.type===type && (!best || x.start>best.start) ? x : best; }, null);
  }
  function renderHero() {
    // sleep row (near the head): current state + duration — asleep now, or how
    // long baby's been awake since the last nap ended (pairs with the sleep
    // prediction). t2 gives the last nap's length for context.
    $("#slpIc").innerHTML = ICONS.sleep;
    if (db.timer && db.timer.type==="sleep") {
      $("#slpT1").textContent = t("asleep")+" · "+durShort(Date.now()-db.timer.start);
      $("#slpT2").textContent = "";
    } else {
      var ls=db.events.reduce(function (b,x){ return x.type==="sleep" && x.end && (!b || x.end>b.end) ? x : b; }, null);
      if (ls) {
        $("#slpT1").textContent = t("awake")+" · "+durShort(Date.now()-ls.end);
        $("#slpT2").textContent = t("last_nap")+" "+durShort(ls.end-ls.start);
      } else { $("#slpT1").textContent="—"; $("#slpT2").textContent=""; }
    }
    var lf=latestOf("feed"), ld=latestOf("diaper");
    if (lf) {
      $("#fedIc").innerHTML = fedIcon(lf.sub);
      $("#fedT1").textContent = t("hero_fed")+" "+agoStr(lf.start)+" "+t("ago");
      $("#fedT2").textContent = t("by")+" "+careById(lf.by||"you").name;
    } else { $("#fedIc").innerHTML=ICONS.nurse; $("#fedT1").textContent=t("no_feed"); $("#fedT2").textContent=""; }
    if (ld) {
      $("#diaIc").innerHTML = ICONS.diaper;
      $("#diaT1").textContent = t("hero_changed")+" "+agoStr(ld.start)+" "+t("ago");
      $("#diaT2").textContent = t("by")+" "+careById(ld.by||"you").name;
    } else { $("#diaIc").innerHTML=ICONS.diaper; $("#diaT1").textContent=t("no_change"); $("#diaT2").textContent=""; }
  }

  /* ---------- predicted next action(s) ----------
     Looks at feed/sleep/diaper independently: the average gap between the
     last few of that type vs. how long it's actually been since the last
     one. Sorted by how far each type is into its typical cycle (highest
     elapsed/average ratio first) — the top 2 that clear ~55% of a typical
     cycle become the primary card and a lighter secondary chip, so the app
     always offers a second guess when the data supports one instead of
     betting everything on a single call. No timer running, since there's
     no "next action" question mid-feed/mid-sleep — the hero already covers
     that. */
  function computePredictions() {
    if (db.timer) return [];
    var now=Date.now();
    var byType = {
      feed:   db.events.filter(function (x){ return x.type==="feed"; }),
      sleep:  db.events.filter(function (x){ return x.type==="sleep"; }),
      diaper: db.events.filter(function (x){ return x.type==="diaper"; })
    };
    var cands=[];
    Object.keys(byType).forEach(function (type) {
      var evs=byType[type];
      if (evs.length<2) return;
      if (type==="feed" && !predictedFeedSub(evs)) return; // no nursing/bottle history to act on yet
      var recent=evs.slice(-6), gaps=[];
      for (var i=1;i<recent.length;i++) gaps.push(recent[i].start-recent[i-1].start);
      var avg=gaps.reduce(function (a,b){return a+b;},0)/gaps.length;
      if (avg<=0) return;
      var last=evs[evs.length-1], elapsed=now-last.start, ratio=elapsed/avg;
      cands.push({ type:type, evs:evs, avg:avg, elapsed:elapsed, ratio:ratio });
    });
    cands.sort(function (a,b){ return b.ratio-a.ratio; });
    // Always surface the top 2 most-due types (no ratio threshold), so the
    // section is consistently two side-by-side tiles rather than sometimes
    // one or none. Honesty is preserved by the per-tile timing label
    // (renderPredict) — a not-yet-due prediction reads "in ~40m", not a
    // false "Soon". Feed+Sleep+Diaper all have seeded history, so in normal
    // use this is always 2; only a brand-new baby with <2 logged types
    // could yield fewer, and that renders as one full-width tile (never a
    // blank half).
    return cands.slice(0,2);
  }
  function predictedFeedSub(evs) {
    var subs=evs.slice(-5).map(function (e){ return e.sub; }).filter(function (s){ return s==="nursing"||s==="bottle"; });
    if (!subs.length) return null;
    var counts={}; subs.forEach(function (s){ counts[s]=(counts[s]||0)+1; });
    if (counts.nursing===counts.bottle) return subs[subs.length-1];
    return counts.nursing>(counts.bottle||0) ? "nursing" : "bottle";
  }
  function buildPredictAction(p) {
    var icon, color, label, actFn, badgeId, cycleWord =
      p.type==="feed" ? "feeds" : p.type==="sleep" ? "sleeps" : "diapers";
    if (p.type==="sleep") {
      icon=ICONS.sleep; color="var(--sleep)"; label=t("sleep"); badgeId="actSleep";
      actFn=function (){ startTimer("sleep"); };
    } else if (p.type==="diaper") {
      icon=ICONS.diaper; color="var(--diaper)"; label=t("diaper")+" · "+t("wet"); badgeId="actDiaper";
      actFn=function (){ logDiaper("wet", Date.now()); };
    } else {
      icon=ICONS.feed; color="var(--feed)";
      var sub=predictedFeedSub(p.evs);
      if (sub==="bottle") {
        var lastBottle=p.evs.filter(function (e){ return e.sub==="bottle"; }).pop();
        var amount=(lastBottle&&lastBottle.amount)||db.pref.lastAmount||(db.pref.unit==="oz"?4:120);
        var unit=(lastBottle&&lastBottle.unit)||db.pref.unit||"ml";
        label=t("bottle")+" · "+amount+" "+unit; badgeId="actBottle";
        actFn=function (){ logBottle(amount, unit, Date.now()); };
      } else {
        var side=nextSide();
        label=t("nursing")+" · "+(side==="R"?t("right"):t("left")); badgeId="actNurse";
        actFn=function (){ startTimer("feed", side); };
      }
    }
    return { icon:icon, color:color, label:label, actFn:actFn, badgeId:badgeId, cycleWord:cycleWord };
  }

  /* Renders the (up to 2) predicted tiles AND, in the same pass, hides
     whichever of the 4 core manual buttons are now covered by a tile —
     the row defers to the prediction instead of duplicating it. Solids/
     Bath/More are never touched here; they have no predictable cycle, so
     they stay as always-available constants in the row. */
  var lastPredictMsgs=[null,null];
  function renderPredict() {
    var group=$("#predictGroup"), tiles=$("#predictTiles"), t0=$("#predictTile0"), t1=$("#predictTile1");
    ["actNurse","actBottle","actSleep","actDiaper"].forEach(function (id){ $("#"+id).hidden=false; });
    var list=computePredictions();
    if (!list.length) {
      group.hidden=true;
      t0.hidden=true; t0.onclick=null; t1.hidden=true; t1.onclick=null;
      lastPredictMsgs=[null,null];
      return;
    }
    group.hidden=false;
    tiles.classList.toggle("single", list.length<2);
    [t0, t1].forEach(function (tile, i) {
      var p=list[i];
      if (!p) { tile.hidden=true; tile.onclick=null; lastPredictMsgs[i]=null; return; }
      var a=buildPredictAction(p);
      // Honest timing label now that tiles always show (even not-yet-due):
      // overdue -> "Ready"; otherwise the real estimated wait, e.g. "in ~40m".
      var msLeft = p.avg - p.elapsed;
      var due = msLeft <= 0;
      var lead = due ? "Ready" : "in ~"+durShort(msLeft);
      tile.querySelector(".predict-tile-ic").innerHTML=a.icon;
      tile.querySelector(".predict-tile-ic").style.color=a.color;
      // urgency shows in colour: an overdue ("Ready") tile warms up and its lead
      // takes the accent; a not-yet-due tile stays quiet. So the "do this next"
      // answer is seen, not just read.
      tile.classList.toggle("due", due);
      var leadEl = tile.querySelector(".predict-tile-lead");
      leadEl.textContent = lead;
      leadEl.style.color = due ? "var(--gold-text)" : "var(--dim)";
      tile.querySelector(".predict-tile-msg").textContent = a.label;
      tile.setAttribute("aria-label", "Log "+a.label+(msLeft<=0?" now":" (due in about "+durShort(msLeft)+")")+" — predicted");
      if (tile.hidden || lastPredictMsgs[i]!==a.label) { tile.classList.remove("pop"); void tile.offsetWidth; tile.classList.add("pop"); }
      tile.hidden=false;
      tile.onclick=function (){ buzz(16); a.actFn(); };
      if (a.badgeId) $("#"+a.badgeId).hidden=true; // this action moved up into a tile — don't show it twice
      lastPredictMsgs[i]=a.label;
    });
  }

  // Rolling last-24h window (matches the ruler + list), NOT the calendar day —
  // parents reason in "the last day", and a midnight reset hides the overnight
  // the other caregiver covered.
  function last24Events() { var cut=Date.now()-86400000; return db.events.filter(function (x){ return x.start>=cut; }); }
  function mini(color, icon, value, label) {
    return '<span class="m" style="color:'+color+'"><span class="mi">'+icon+'</span>'+
      '<span class="mt"><span class="mv">'+value+'</span><span class="ml">'+label+'</span></span></span>';
  }
  // The "Last 24 Hours" header: totals/counts for the window (the aggregate).
  // Recency ("last fed/changed/slept") lives on the baby-hero, so it's never
  // repeated here.
  function renderSummary() {
    var now=Date.now(), cut=now-86400000, ev=last24Events(), out="";
    // sleep total — clamp overlapping sleeps to the window, include in-progress
    var sleepMs=0;
    db.events.forEach(function (x){ if (x.type==="sleep" && x.end){ var a=Math.max(x.start,cut), b=Math.min(x.end,now); if (b>a) sleepMs+=b-a; } });
    if (db.timer && db.timer.type==="sleep") sleepMs += now - Math.max(db.timer.start,cut);
    out += mini("var(--sleep)", ICONS.sleep, sleepMs?durShort(sleepMs):"0m", t("sleep").toLowerCase());
    // feeds — count (+ bottle volume, unit-aware)
    var feeds=ev.filter(function (x){ return x.type==="feed"; });
    var bottles=feeds.filter(function (x){ return x.sub==="bottle"; }), vol="";
    if (bottles.length) {
      var unit=bottles[bottles.length-1].unit||db.pref.unit||"ml";
      var tot=bottles.filter(function (x){ return (x.unit||"ml")===unit; }).reduce(function (a,x){ return a+(+x.amount||0); },0);
      vol=" · "+(unit==="oz"?(+tot.toFixed(1)):tot)+" "+unit;
    }
    out += mini("var(--feed)", ICONS.feed, String(feeds.length), t("feeds")+vol);
    // diapers — count, wet/dirty breakdown as the label (mixed counts in both)
    var dp=ev.filter(function (x){ return x.type==="diaper"; });
    var w=dp.filter(function (x){ return x.sub!=="dirty"; }).length, d=dp.filter(function (x){ return x.sub!=="wet"; }).length;
    out += mini("var(--diaper)", ICONS.diaper, String(dp.length),
      dp.length ? w+" "+t("wet").toLowerCase()+" · "+d+" "+t("dirty").toLowerCase() : t("diapers").toLowerCase());
    // solids / meds only when they happened in the window
    var solids=feeds.filter(function (x){ return x.sub==="solids"; });
    if (solids.length) out += mini("var(--gold-text)", ICONS.solids, String(solids.length), t("solids").toLowerCase());
    var meds=ev.filter(function (x){ return x.type==="meds"; });
    if (meds.length) out += mini("var(--gold-text)", ICONS.meds, String(meds.length), t("meds").toLowerCase());
    $("#l24sum").innerHTML=out;
  }

  // The vertical 24h ruler: the whole last-24h in proportion, so the day's
  // shape reads at a glance. Sleep = tall bands (the signal parents most want
  // spatially); every other event = a small colour-coded dot. "now" at the top
  // to match the newest-first detail list beside it.
  function renderRuler() {
    var ruler=$("#ruler"); if (!ruler) return;
    var end=Date.now(), WINDOW=86400000, start=end-WINDOW;
    function pos(t){ return Math.max(0, Math.min(100, (end-t)/WINDOW*100)); }
    var html="";
    // hour gridlines + labels every 6h (now, -6h, -12h, -18h, -24h)
    for (var h=0; h<=24; h+=6) {
      var tt=end-h*3600000, top=pos(tt);
      var d=new Date(tt+1800000), hr=d.getHours(); // round to nearest hour for the label
      var lab=h===0 ? t("now") : (hr%12||12)+(hr<12?"a":"p");
      html+='<div class="r-tick" style="top:'+top+'%"></div>';
      html+='<div class="r-lab" style="top:'+top+'%">'+lab+'</div>';
    }
    // sleep bands (include an in-progress sleep, and clamp to the window)
    var sleeps=db.events.filter(function (x){ return x.type==="sleep" && (x.end||0)>start && x.start<end; });
    if (db.timer && db.timer.type==="sleep") sleeps.push({ start:db.timer.start, end:end });
    sleeps.forEach(function (s){
      var a=Math.max(s.start,start), b=Math.min(s.end||end,end);
      if (b<=a) return;
      html+='<div class="r-band" style="top:'+pos(b)+'%;height:'+(pos(a)-pos(b))+'%"></div>';
    });
    // every other event = a dot at its time, coloured by category
    db.events.filter(function (x){ return x.type!=="sleep" && x.start>=start && x.start<=end; }).forEach(function (ev){
      html+='<div class="r-dot" style="top:'+pos(ev.start)+'%;background:'+colorFor(ev.type)+'"></div>';
    });
    ruler.innerHTML=html;
    // hide the whole ruler when there's nothing in the window (list shows empty state)
    var any=sleeps.length || db.events.some(function (x){ return x.start>=start && x.start<=end; });
    ruler.style.display = any ? "" : "none";
  }

  function renderList() {
    var list=$("#list"); list.innerHTML="";
    // last 24 hours only, newest first — the timeline is a rolling day, not the
    // whole history. A day divider marks each calendar-day boundary inside it.
    var cutoff=Date.now()-86400000;
    var evs=db.events.filter(function (x){ return x.start>=cutoff; }).sort(function (a,b){return b.start-a.start;});
    if (!evs.length){ list.innerHTML='<div class="empty"><div class="big">🌙</div>'+t("nothing")+'<br>'+t("tapbelow")+'</div>'; return; }
    var lastDay=null;
    evs.forEach(function (ev){
      var dk=dayKey(ev.start);
      if (dk!==lastDay) {
        // no divider above the newest group (implicitly "today"); one appears at
        // each boundary as the list crosses down into an earlier calendar day.
        if (lastDay!==null) {
          var d=document.createElement("div"); d.className="daydiv";
          d.innerHTML='<span class="ln"></span><span class="lbl">'+dayLabel(ev.start)+'</span><span class="ln"></span>';
          list.appendChild(d);
        }
        lastDay=dk;
      }
      var who=careById(ev.by||"you");
      var cp=fmtClockParts(ev.start);
      var det=detailFor(ev);
      // attribution only when it wasn't the current user — keeps the timeline
      // quiet for solo use, surfaces "who" exactly when it matters (helper/partner)
      var showWho = (ev.by||"you") !== db.cur;
      var row=document.createElement("div"); row.className="row rowwrap";
      row.innerHTML =
        '<div class="swipeunder" aria-hidden="true">'+
          '<span class="sw-edit">Edit</span><button class="sw-del" tabindex="-1" aria-hidden="true">Delete</button>'+
        '</div>'+
        '<button class="rowbtn" aria-label="'+labelFor(ev)+(det?" "+det:"")+' at '+fmtClock(ev.start)+(showWho?" by "+who.name:"")+' — swipe right to edit, left to reveal delete">'+
          '<div class="tl-time"><span class="hm">'+cp.hm+'</span><span class="ap">'+cp.ap+'</span></div>'+
          '<div class="tl-node"><span class="spine" aria-hidden="true"></span><span class="node '+catClass(ev.type)+'">'+ICONS[ev.type]+'</span></div>'+
          '<div class="tl-body"><div class="t1">'+labelFor(ev)+(det?' <span class="dim">· '+det+'</span>':'')+'</div>'+
            (showWho?'<div class="t2">'+who.name+'</div>':'')+'</div>'+
        '</button>';
      var btn=row.querySelector(".rowbtn");
      wireSwipe(row, btn, function (){ editSheet(ev.id); }, function (){ removeEvent(ev.id); });
      list.appendChild(row);
    });
  }

  /* Swipe-right auto-triggers Edit on release (safe, non-destructive — no
     harm in firing straight from the gesture). Swipe-left only REVEALS
     Delete; it does not fire on release — a destructive action needs its
     own distinct confirming tap on the now-visible Delete button, so a
     slightly-too-long drag-and-release can never silently delete a log
     entry. Tap always still opens the edit sheet as the unconditional
     baseline — swipe is an accelerator, never the only path, so mouse/
     keyboard/screen-reader users lose nothing. Only one row can be
     revealed at a time. */
  function wireSwipe(row, btn, onEdit, onDelete) {
    var startX=0, startY=0, dx=0, active=false, locked=null, suppressClick=false;
    var THRESH=64, REVEAL=96;
    var under=row.querySelector(".swipeunder"), delBtn=row.querySelector(".sw-del");

    function closeReveal() {
      row.classList.remove("revealed"); btn.style.transform="";
      under.setAttribute("aria-hidden","true"); delBtn.setAttribute("tabindex","-1"); delBtn.setAttribute("aria-hidden","true");
      if (revealedRow===closeReveal) revealedRow=null;
    }
    function openReveal() {
      if (revealedRow && revealedRow!==closeReveal) revealedRow();
      row.classList.add("revealed"); btn.style.transform="translateX(-"+REVEAL+"px)";
      under.setAttribute("aria-hidden","false"); delBtn.setAttribute("tabindex","0"); delBtn.setAttribute("aria-hidden","false");
      revealedRow=closeReveal;
    }
    delBtn.addEventListener("click", function (e){ e.stopPropagation(); closeReveal(); onDelete(); });

    btn.addEventListener("pointerdown", function (e){
      if (revealedRow && revealedRow!==closeReveal) revealedRow();
      startX=e.clientX; startY=e.clientY; dx = row.classList.contains("revealed") ? -REVEAL : 0; active=true; locked=null;
    });
    btn.addEventListener("pointermove", function (e){
      if (!active) return;
      var mx=e.clientX-startX, my=e.clientY-startY;
      if (locked===null) { if (Math.abs(mx)<6 && Math.abs(my)<6) return; locked = Math.abs(mx)>Math.abs(my) ? "x" : "y"; }
      if (locked!=="x") return;
      var base = row.classList.contains("revealed") ? -REVEAL : 0;
      dx = Math.max(-REVEAL, Math.min(96, base+mx));
      row.classList.add("swiping"); btn.style.transform="translateX("+dx+"px)";
    });
    function end() {
      if (!active) return; active=false; row.classList.remove("swiping");
      if (locked==="x") {
        suppressClick=true;
        if (dx<=-THRESH) { buzz(20); openReveal(); }
        else if (dx>=THRESH) { buzz(20); closeReveal(); onEdit(); }
        else { closeReveal(); }
      }
    }
    btn.addEventListener("pointerup", end);
    btn.addEventListener("pointercancel", function (){ active=false; row.classList.remove("swiping"); });
    btn.addEventListener("pointerleave", function (){ if (active && locked!=="x") { active=false; row.classList.remove("swiping"); } });
    btn.addEventListener("click", function (e){
      if (suppressClick) { suppressClick=false; e.preventDefault(); return; }
      if (row.classList.contains("revealed")) { closeReveal(); return; }
      onEdit();
    });
  }

  /* ---------- timer ---------- */
  function renderTimer() {
    var bar=$("#timerbar"), sideBtn=$("#timerSide"), aSleep=$("#actSleep");
    if (db.timer) {
      bar.classList.add("on"); var isSleep=db.timer.type==="sleep";
      $("#timerPulse").style.background = isSleep?"var(--sleep)":"var(--feed)";
      $("#timerK").textContent = (isSleep?t("asleep"):t("nursing")+" · "+(db.timer.side==="R"?t("right"):t("left"))) + " · "+careById(db.timer.by||db.cur).name;
      $("#sleepLbl").textContent = isSleep?t("wake"):t("sleep");
      aSleep.classList.toggle("armed", isSleep);
      sideBtn.hidden = isSleep; if (!isSleep) sideBtn.textContent = "⇄ "+(db.timer.side==="R"?t("left"):t("right"));
    } else { bar.classList.remove("on"); $("#sleepLbl").textContent=t("sleep"); aSleep.classList.remove("armed"); sideBtn.hidden=true; }
    tickTimer();
  }
  function tickTimer() { if (!db.timer) return; var v=dur(Date.now()-db.timer.start); $("#timerV").textContent=v;
    if (db.timer) $("#heroBig").innerHTML='<b>'+v+'</b>'; }
  function startTimer(type, side) {
    if (db.timer) { toast("Stop the current timer first"); return; }
    db.timer={ type:type, side:side||null, start:Date.now(), by:db.cur }; persist(); buzz(); render();
    toast((type==="sleep"?t("sleep"):t("nursing")+" · "+(side==="R"?t("right"):t("left")))+" started", null, null, true);
  }
  function stopTimer() {
    if (!db.timer) return; var tm=db.timer, end=Date.now();
    db.events.push({ id:uid(), type:tm.type, sub:tm.type==="feed"?"nursing":undefined, side:tm.side, by:tm.by||db.cur, start:tm.start, end:end });
    db.timer=null; persist(); buzz([14,60,14]); render();
    var who=careById(db.cur).name;
    toast((tm.type==="sleep"?t("sleep"):(tm.side==="R"?t("right"):t("left")))+" · "+durShort(end-tm.start)+" "+t("saved")+" · "+who, null, null, true);
  }
  $("#timerStop").addEventListener("click", stopTimer);
  $("#timerSide").addEventListener("click", function (){ if (db.timer&&db.timer.type==="feed"){ db.timer.side=db.timer.side==="R"?"L":"R"; persist(); buzz(); renderTimer(); } });

  /* ---------- logging ---------- */
  function addEvent(o, msg) { o.id=uid(); o.by=db.cur; db.events.push(o); db.events.sort(function (a,b){return a.start-b.start;});
    persist(); buzz(); render(); closeSheet();
    toast(msg+" · "+careById(db.cur).name, "Undo", function (){ var i=db.events.indexOf(o); if (i>=0){ db.events.splice(i,1); persist(); render(); } }, true); }
  function logDiaper(sub, when) { addEvent({ type:"diaper", sub:sub, start:when }, t("diaper")+" · "+detailFor({type:"diaper",sub:sub})+" "+t("saved")); }
  function logBottle(amount, unit, when) { db.pref.lastAmount=amount; db.pref.unit=unit; addEvent({ type:"feed", sub:"bottle", amount:amount, unit:unit, start:when }, t("bottle")+" · "+amount+" "+unit+" "+t("saved")); }
  function logSolids(food, when) { addEvent({ type:"feed", sub:"solids", note:food||t("solids"), start:when }, t("solids")+" "+t("saved")); }

  function removeEvent(id) {
    var i=db.events.findIndex(function (x){return x.id===id;}); if (i<0) return;
    lastDeleted=db.events[i]; db.events.splice(i,1); persist(); render();
    toast("Entry deleted", "Undo", function (){ if (lastDeleted){ db.events.push(lastDeleted); db.events.sort(function (a,b){return a.start-b.start;}); lastDeleted=null; persist(); render(); } });
  }

  /* ---------- toast ---------- */
  function toast(msg, actionLabel, actionFn, check) {
    var el=$("#toast"), a=$("#toastAction"), c=$("#toastChk");
    $("#toastMsg").textContent=msg; c.hidden=!check;
    if (actionLabel){ a.hidden=false; a.textContent=actionLabel; a.onclick=function (){ hideToast(); actionFn&&actionFn(); }; }
    else { a.hidden=true; a.onclick=null; }
    el.classList.add("on"); clearTimeout(toastTimer); toastTimer=setTimeout(hideToast, actionLabel?4500:2200);
  }
  function hideToast() { $("#toast").classList.remove("on"); }

  /* One-time coach-marks for the app's non-obvious gestures — corner "HOLD"
     labels alone tested as easy to miss, and swiping a row has no visible
     affordance at all. Two short tips, not one long one. Skipped in Simple
     mode, where these advanced interactions are deliberately less surfaced.
     Shown once per caregiver, not once globally, so a caregiver switching in
     later still gets them. */
  function maybeShowGestureTip() {
    var c=cur();
    if (c.seenGestureTip || simpleOn()) return;
    c.seenGestureTip=true; persist();
    setTimeout(function (){ toast("Tip: hold Nurse for the other side, hold Diaper for dirty/mixed", "Got it"); }, 900);
    setTimeout(function (){ toast("Tip: swipe an entry right to edit, left to reveal Delete", "Got it"); }, 5600);
  }

  /* ---------- sheet infra ---------- */
  var lastFocus=null;
  function openSheet(html) {
    var sh=$("#sheet"); sh.innerHTML='<div class="grip"></div>'+html; $("#scrim").classList.add("on"); sh.classList.add("on");
    lastFocus=document.activeElement; var f=sh.querySelector("button, input, [tabindex]"); if (f) setTimeout(function (){ f.focus(); }, 60);
  }
  function closeSheet() { $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); if (lastFocus&&lastFocus.focus) lastFocus.focus(); }
  $("#scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e){ if (e.key==="Escape") closeSheet(); });

  function whenControl() {
    return '<h4>'+t("when")+'</h4><div class="whenrow" id="whenRow">'+
      '<button data-off="0" aria-pressed="true">'+t("now")+'</button>'+
      '<button data-off="15">15m</button><button data-off="30">30m</button><button data-off="60">1h</button>'+
      '<input type="time" id="whenTime" aria-label="Custom time" /></div>';
  }
  function wireWhen(root) {
    var offset={v:0}, custom=null;
    root.querySelectorAll("#whenRow [data-off]").forEach(function (b){ b.addEventListener("click", function (){
      root.querySelectorAll("#whenRow [data-off]").forEach(function (x){ x.setAttribute("aria-pressed", x===b?"true":"false"); });
      offset.v=+b.dataset.off; custom=null; var ti=root.querySelector("#whenTime"); if (ti) ti.value="";
    }); });
    var ti=root.querySelector("#whenTime");
    if (ti) ti.addEventListener("change", function (){ if (!ti.value){ custom=null; return; }
      root.querySelectorAll("#whenRow [data-off]").forEach(function (x){ x.setAttribute("aria-pressed","false"); });
      var p=ti.value.split(":"), d=new Date(); d.setHours(+p[0],+p[1],0,0); if (d.getTime()>Date.now()) d.setDate(d.getDate()-1); custom=d.getTime(); });
    return function (){ return custom!=null ? custom : Date.now()-offset.v*60000; };
  }

  /* ---------- long-press helper ---------- */
  function pressable(el, onTap, onHold) {
    var timer=null, held=false;
    function down(e) { held=false; timer=setTimeout(function (){ held=true; buzz(28); onHold(); }, 480); }
    function up(e) { clearTimeout(timer); if (!held && e.type!=="pointerleave" && e.type!=="pointercancel") onTap(); }
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointerleave", function (){ clearTimeout(timer); });
    el.addEventListener("pointercancel", function (){ clearTimeout(timer); });
    el.addEventListener("contextmenu", function (e){ e.preventDefault(); });
    el.addEventListener("keydown", function (e){ if (e.key==="Enter"||e.key===" "){ e.preventDefault(); onTap(); } if (e.key==="h"||e.key==="H") onHold(); });
  }

  /* ---------- sheets ---------- */
  function bottleSheet() {
    var unit=db.pref.unit||"ml", amount=db.pref.lastAmount||(unit==="oz"?4:120);
    openSheet('<h3 id="sheetTitle">'+t("bottle")+'</h3><p class="sub">'+t("onetap")+'</p><div id="tabbody"></div>');
    paint();
    function paint() {
      var body=$("#tabbody");
      var presets = unit==="oz" ? [2,3,4,5,6] : [60,90,120,150,180];
      var step = unit==="oz" ? 0.25 : 10;
      body.innerHTML='<div class="unitrow"><button data-u="ml" aria-pressed="'+(unit==="ml")+'">ml</button><button data-u="oz" aria-pressed="'+(unit==="oz")+'">oz</button></div>'+
        '<div class="presets" id="presets">'+presets.map(function (p){ return '<button data-p="'+p+'" aria-pressed="'+(p===amount)+'">'+p+'</button>'; }).join("")+'</div>'+
        '<div class="stepper"><div class="amt"><span id="amtV" class="tnum disp">'+fmtAmt(amount)+'</span> <small>'+unit+'</small></div>'+
        '<div class="pm"><button class="rnd" id="minus" aria-label="less">−</button><button class="rnd" id="plus" aria-label="more">+</button></div></div>'+
        whenControl()+
        '<div class="stickycta"><button class="cta" id="logBottle">'+t("log_bottle")+'</button></div>';
      function fmtAmt(a){ return unit==="oz"?String(+(+a).toFixed(2)):a; }
      function upd(){ $("#amtV").textContent=fmtAmt(amount); body.querySelectorAll("#presets [data-p]").forEach(function (x){ x.setAttribute("aria-pressed", (+x.dataset.p)===amount?"true":"false"); }); }
      body.querySelector("#minus").addEventListener("click", function (){ amount=Math.max(step,+(amount-step).toFixed(2)); upd(); });
      body.querySelector("#plus").addEventListener("click", function (){ amount=+(amount+step).toFixed(2); upd(); });
      body.querySelectorAll("#presets [data-p]").forEach(function (b){ b.addEventListener("click", function (){ amount=+b.dataset.p; upd(); }); });
      body.querySelectorAll("[data-u]").forEach(function (b){ b.addEventListener("click", function (){ unit=b.dataset.u; db.pref.unit=unit; persist(); amount=unit==="oz"?4:120; paint(); }); });
      var resolve=wireWhen(body);
      body.querySelector("#logBottle").addEventListener("click", function (){ logBottle(amount, unit, resolve()); });
    }
  }

  function diaperPicker() {
    openSheet('<h3 id="sheetTitle">'+t("choose_diaper")+'</h3><p class="sub">'+t("onetap")+'</p>'+
      '<div class="seg three" style="margin-bottom:6px">'+
      '<button class="chip d" data-s="wet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg><span class="cl">'+t("wet")+'</span></button>'+
      '<button class="chip d" data-s="dirty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19h12a3 3 0 0 0 .5-6 4 4 0 0 0-6.9-3A3.5 3.5 0 0 0 6 13a3 3 0 0 0 0 6z"/></svg><span class="cl">'+t("dirty")+'</span></button>'+
      '<button class="chip d" data-s="mixed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/><path d="M9 13h6"/></svg><span class="cl">'+t("mixed")+'</span></button></div>'+
      whenControl());
    var body=$("#sheet"), resolve=wireWhen(body);
    body.querySelectorAll("[data-s]").forEach(function (b){ b.addEventListener("click", function (){ logDiaper(b.dataset.s, resolve()); }); });
  }

  function solidsSheet() {
    openSheet('<h3 id="sheetTitle">'+t("solids")+'</h3><p class="sub"></p>'+
      '<input class="field" id="foodInput" placeholder="What did baby eat? (optional)" autocomplete="off" />'+whenControl()+
      '<div class="stickycta"><button class="cta" id="logSolid">'+t("log_solids")+'</button></div>');
    var body=$("#sheet"), resolve=wireWhen(body);
    body.querySelector("#logSolid").addEventListener("click", function (){ logSolids(body.querySelector("#foodInput").value.trim(), resolve()); });
  }
  function logBath(when) { addEvent({ type:"bath", start:when }, t("bath")+" "+t("saved")); }

  function tempSheet() {
    var unit=db.pref.tempUnit||"F", value=db.pref.lastTemp||(unit==="F"?98.6:37.0);
    openSheet('<h3 id="sheetTitle">'+t("temp")+'</h3><p class="sub">'+t("onetap")+'</p><div id="tempbody"></div>');
    paint();
    function paint() {
      var body=$("#tempbody");
      body.innerHTML='<div class="unitrow"><button data-u="F" aria-pressed="'+(unit==="F")+'">°F</button><button data-u="C" aria-pressed="'+(unit==="C")+'">°C</button></div>'+
        '<div class="stepper"><div class="amt"><span id="tempV" class="tnum disp">'+value.toFixed(1)+'</span> <small>°'+unit+'</small></div>'+
        '<div class="pm"><button class="rnd" id="tminus" aria-label="less">−</button><button class="rnd" id="tplus" aria-label="more">+</button></div></div>'+
        whenControl()+
        '<div class="stickycta"><button class="cta" id="logTemp">'+t("log_temp")+'</button></div>';
      function upd(){ $("#tempV").textContent=value.toFixed(1); }
      body.querySelector("#tminus").addEventListener("click", function (){ value=+(value-0.1).toFixed(1); upd(); });
      body.querySelector("#tplus").addEventListener("click", function (){ value=+(value+0.1).toFixed(1); upd(); });
      body.querySelectorAll("[data-u]").forEach(function (b){ b.addEventListener("click", function (){
        var nu=b.dataset.u; if (nu===unit) return;
        value = nu==="C" ? +((value-32)*5/9).toFixed(1) : +((value*9/5)+32).toFixed(1);
        unit=nu; db.pref.tempUnit=unit; persist(); paint();
      }); });
      var resolve=wireWhen(body);
      body.querySelector("#logTemp").addEventListener("click", function (){ logTemp(value, unit, resolve()); });
    }
  }
  function logTemp(value, unit, when) {
    db.pref.lastTemp=value; db.pref.tempUnit=unit;
    addEvent({ type:"temp", value:value, unit:unit, start:when }, t("temp")+" · "+value.toFixed(1)+"°"+unit+" "+t("saved"));
  }

  function medsSheet() {
    openSheet('<h3 id="sheetTitle">'+t("meds")+'</h3><p class="sub"></p>'+
      '<input class="field" id="medName" placeholder="'+t("meds_name_ph")+'" autocomplete="off" />'+
      '<input class="field" id="medDose" placeholder="'+t("meds_dose_ph")+'" autocomplete="off" />'+
      whenControl()+
      '<div class="stickycta"><button class="cta" id="logMedsBtn">'+t("log_meds")+'</button></div>');
    var body=$("#sheet"), resolve=wireWhen(body);
    body.querySelector("#logMedsBtn").addEventListener("click", function (){
      logMeds(body.querySelector("#medName").value.trim(), body.querySelector("#medDose").value.trim(), resolve());
    });
  }
  function logMeds(name, dose, when) {
    addEvent({ type:"meds", name:name||t("meds"), dose:dose||"", start:when },
      (name||t("meds"))+(dose?" · "+dose:"")+" "+t("saved"));
  }

  function moreShortcutsSheet() {
    openSheet('<h3 id="sheetTitle">'+t("more")+'</h3><p class="sub">'+t("more_sub")+'</p>'+
      '<div class="seg" style="margin-bottom:6px">'+
      '<button class="chip" data-go="meds">'+ICONS.meds+'<span class="cl">'+t("meds")+'</span></button>'+
      '<button class="chip" data-go="temp">'+ICONS.temp+'<span class="cl">'+t("temp")+'</span></button>'+
      '</div>'+
      '<h4>'+t("coming_soon")+'</h4><div class="picker">'+["Pump","Growth","Export"].map(function (m){ return '<button data-soon="'+m+'">'+m+'</button>'; }).join("")+'</div>');
    $("#sheet").querySelectorAll("[data-go]").forEach(function (b){ b.addEventListener("click", function (){
      if (b.dataset.go==="meds") medsSheet(); else tempSheet();
    }); });
    $("#sheet").querySelectorAll("[data-soon]").forEach(function (b){ b.addEventListener("click", function (){ toast('"'+b.dataset.soon+'" is on the roadmap ✨'); }); });
  }

  function editSheet(id) {
    var ev=db.events.filter(function (x){return x.id===id;})[0]; if (!ev) return;
    var d=new Date(ev.start), hh=String(d.getHours()).padStart(2,"0"), mm=String(d.getMinutes()).padStart(2,"0");
    openSheet('<h3 id="sheetTitle">'+labelFor(ev)+'</h3><p class="sub">'+detailFor(ev)+' · '+careById(ev.by||"you").name+'</p>'+
      '<label class="lbl">Time</label><input class="field" id="etime" type="time" value="'+hh+":"+mm+'" />'+
      '<div class="stickycta ctarow"><button class="cta danger" id="edel">Delete</button><button class="cta" id="esave">Save time</button></div>');
    $("#esave").addEventListener("click", function (){ var v=$("#etime").value; if (v){ var p=v.split(":"), nd=new Date(ev.start); nd.setHours(+p[0],+p[1],0,0);
      if (nd.getTime()>Date.now()+60000) nd.setDate(nd.getDate()-1); var delta=nd.getTime()-ev.start; ev.start=nd.getTime(); if (ev.end) ev.end+=delta;
      db.events.sort(function (a,b){return a.start-b.start;}); persist(); render(); } closeSheet(); toast("Time updated", null, null, true); });
    $("#edel").addEventListener("click", function (){ closeSheet(); removeEvent(id); });
  }

  function shareSheet() {
    var members = db.care.map(function (c){
      var tags=""; if (c.simple) tags+='<span class="tag">Simple mode</span>'; if (c.lang&&c.lang!=="en") tags+='<span class="tag">'+c.lang.toUpperCase()+'</span>';
      var isCur=c.id===db.cur;
      return '<div class="member"><span class="av" style="background:'+c.color+'">'+c.badge+'</span>'+
        '<div class="info"><div class="nm">'+c.name+'</div><div class="rl">'+c.role+'</div><div class="badges">'+tags+'</div></div>'+
        '<button class="logas" data-log="'+c.id+'" data-cur="'+(isCur?1:0)+'">'+(isCur?"Logging":"Log as")+'</button></div>';
    }).join("");
    openSheet('<h3 id="sheetTitle">Family &amp; sharing</h3><p class="sub">Everyone logs the same baby, live. Who logged what is always shown.</p>'+
      '<div class="freeline"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'+t("never_paywalled")+'</div>'+
      members+
      '<h4>Invite a caregiver</h4><div class="invite"><code>lull.family / 7K9-QX</code><button id="copyInv">Copy</button></div>'+
      '<p class="hint">Send this to your partner or helper; they join the same baby instantly.</p>'+
      '<button class="cta ghost" id="simLive2">👶 Simulate a live update from Grace</button>');
    $("#sheet").querySelectorAll("[data-log]").forEach(function (b){ b.addEventListener("click", function (){ if (b.dataset.log===db.cur) return;
      db.cur=b.dataset.log; persist(); render(); closeSheet(); toast("Now logging as "+cur().name+(simpleOn()?" · simple mode":""), null, null, true);
      maybeShowGestureTip(); }); });
    $("#copyInv").addEventListener("click", function (){ try { navigator.clipboard.writeText("lull.family/7K9-QX"); } catch (e){} toast("Invite copied", null, null, true); });
    $("#simLive2").addEventListener("click", function (){ closeSheet(); simulateHelper(); });
  }

  function simulateHelper() {
    var opts=[{type:"diaper",sub:"wet"},{type:"diaper",sub:"dirty"},{type:"feed",sub:"bottle",amount:db.pref.unit==="oz"?4:120,unit:db.pref.unit||"ml"}];
    var o=opts[Math.floor(Math.random()*opts.length)]; o.id=uid(); o.by="grace"; o.start=Date.now();
    db.events.push(o); db.events.sort(function (a,b){return a.start-b.start;}); persist(); render();
    toast("Grace logged "+labelFor(o).toLowerCase()+" · "+detailFor(o)+" · now", null, null, true);
  }

  function settingsSheet() {
    var me=cur();
    openSheet('<h3 id="sheetTitle">Settings</h3><p class="sub">Personal to '+me.name+'. Each caregiver has their own.</p>'+
      '<h4>Log solids</h4><button class="cta ghost" id="goSolids" style="margin-bottom:6px">'+t("solids")+'…</button>'+
      '<h4>Accessibility &amp; language</h4>'+
      '<div class="toggle"><div><div class="tl">'+t("simple_mode")+'</div><div class="td">Fewer things on screen — hides the stats.</div></div><button class="sw" id="swSimple" aria-pressed="'+me.simple+'" role="switch" aria-label="Simple mode"></button></div>'+
      '<div class="toggle"><div><div class="tl">Larger text &amp; controls</div><div class="td">Bigger type and tap targets throughout — independent of Simple mode.</div></div><button class="sw" id="swAccess" aria-pressed="'+me.access+'" role="switch" aria-label="Larger text and controls"></button></div>'+
      '<div class="toggle"><div><div class="tl">Language</div><div class="td">Demo: English / Tagalog (placeholder — needs native review).</div></div>'+
        '<div class="unitrow" style="margin:0"><button id="langEn" aria-pressed="'+(me.lang!=="tl")+'">EN</button><button id="langTl" aria-pressed="'+(me.lang==="tl")+'">TL</button></div></div>'+
      '<h4>More (coming soon)</h4><div class="picker">'+["Pump","Growth","Export"].map(function (m){ return '<button data-soon="'+m+'">'+m+'</button>'; }).join("")+'</div>');
    $("#goSolids").addEventListener("click", function (){ solidsSheet(); });
    $("#swSimple").addEventListener("click", function (){ me.simple=!me.simple; persist(); this.setAttribute("aria-pressed", me.simple); render(); });
    $("#swAccess").addEventListener("click", function (){ me.access=!me.access; persist(); this.setAttribute("aria-pressed", me.access); render(); });
    $("#langEn").addEventListener("click", function (){ me.lang="en"; persist(); render(); settingsSheet(); });
    $("#langTl").addEventListener("click", function (){ me.lang="tl"; persist(); render(); settingsSheet(); });
    $("#sheet").querySelectorAll("[data-soon]").forEach(function (b){ b.addEventListener("click", function (){ toast('"'+b.dataset.soon+'" is on the roadmap ✨'); }); });
  }

  function babySheet() {
    var dobVal=db.baby.dob?new Date(db.baby.dob).toISOString().slice(0,10):"";
    openSheet('<h3 id="sheetTitle">Baby profile</h3><p class="sub">Used for greetings and (soon) growth charts.</p>'+
      '<input class="field" id="nm" value="'+(db.baby.name||"")+'" placeholder="Baby\'s name" autocomplete="off" />'+
      '<label class="lbl">Date of birth</label><input class="field" id="dob" type="date" value="'+dobVal+'" />'+
      '<div class="stickycta ctarow"><button class="cta ghost" id="cxl">Cancel</button><button class="cta" id="sv">Save</button></div>');
    $("#cxl").addEventListener("click", closeSheet);
    $("#sv").addEventListener("click", function (){ db.baby.name=$("#nm").value.trim()||"Baby"; var dob=$("#dob").value;
      db.baby.dob=dob?new Date(dob+"T12:00:00").getTime():null; persist(); render(); closeSheet(); toast("Profile saved", null, null, true); });
  }

  /* ---------- wire actions ---------- */
  pressable($("#actNurse"),
    function (){ // tap: start on alternation-implied side; if nursing timer running, stop it
      if (db.timer && db.timer.type==="feed") { stopTimer(); return; }
      if (db.timer) { toast("Stop the sleep timer first"); return; }
      var s=nextSide(); db.pref.side=s; startTimer("feed", s); },
    function (){ // hold: other side
      if (db.timer) { toast("Stop the current timer first"); return; }
      var s=nextSide()==="L"?"R":"L"; db.pref.side=s; startTimer("feed", s); });
  pressable($("#actDiaper"),
    function (){ logDiaper("wet", Date.now()); },
    function (){ diaperPicker(); });
  $("#actBottle").addEventListener("click", bottleSheet);
  $("#actSleep").addEventListener("click", function (){
    if (db.timer&&db.timer.type==="sleep") stopTimer();
    else if (db.timer) toast("Stop the nursing timer first");
    else startTimer("sleep"); });
  $("#actSolids").addEventListener("click", solidsSheet);
  $("#actBath").addEventListener("click", function (){ buzz(); logBath(Date.now()); });
  $("#actMoreRow").addEventListener("click", moreShortcutsSheet);

  /* Shows a solid, tappable chevron badge whenever there's more of the
     action row to scroll to (Bath/More living off-screen), and hides it
     once fully scrolled — not a color fade, which tested as too subtle to
     notice against the light theme's surfaces. */
  var actionsRow=$("#actionsRow"), scrollHint=$("#scrollHint");
  function updateScrollHint() {
    var remaining = actionsRow.scrollWidth - actionsRow.clientWidth - actionsRow.scrollLeft;
    scrollHint.classList.toggle("hide", remaining < 16);
  }
  actionsRow.addEventListener("scroll", updateScrollHint);
  scrollHint.addEventListener("click", function (){ actionsRow.scrollBy({ left: 180, behavior: "smooth" }); });
  window.addEventListener("resize", updateScrollHint);
  $("#babyBtn").addEventListener("click", babySheet);
  $("#whoChip").addEventListener("click", shareSheet);
  $("#themeBtn").addEventListener("click", function (){
    var order=["auto","light","dark"], i=order.indexOf(db.pref.theme||"auto");
    db.pref.theme=order[(i+1)%order.length]; persist(); applyTheme(); buzz();
  });
  $("#setBtn").addEventListener("click", settingsSheet);
  $("#sbBack").addEventListener("click", function (){
    if (db.cur==="you") { cur().simple=false; cur().access=false; } else { db.cur="you"; }
    persist(); render(); });
  /* window.confirm() is unreliable here — sandboxed iframes (including how
     this prototype is actually viewed, as a published Artifact) commonly
     omit "allow-modals", which makes confirm() return false immediately
     with no dialog shown at all, silently no-opping the whole action. Use
     an in-app confirm sheet instead of a browser-native dialog. */
  $("#resetBtn").addEventListener("click", function (){
    openSheet('<h3 id="sheetTitle">Reset demo?</h3><p class="sub">This clears all data on this device. Can\'t be undone.</p>'+
      '<div class="stickycta ctarow"><button class="cta ghost" id="rstCxl">Cancel</button><button class="cta danger" id="rstGo">Reset</button></div>');
    $("#rstCxl").addEventListener("click", closeSheet);
    $("#rstGo").addEventListener("click", function (){
      closeSheet();
      Object.keys(K).forEach(function (k){ localStorage.removeItem(K[k]); });
      db.care=DEFAULT_CARE.map(function (c){ return Object.assign({}, c); }); db.cur="you";
      db.pref={ unit:"ml", side:"L", lastAmount:null, stats:["sleep","diapers","feedVol"] };
      db.baby={ name:"Baby", dob: Date.now()-86400000*84 }; db.timer=null; db.events=seed(); persist(); render();
      toast("Demo reset", null, null, true);
    });
  });

  render();
  maybeShowGestureTip();
  setInterval(tickTimer, 1000);
  setInterval(render, 60000);
})();
</script>
